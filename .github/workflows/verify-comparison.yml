name: Verify NightView 1.5 comparison integration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-comparison.yml
      - source/current/**
      - STAGED_SOURCE_SHA256_1_5.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightview-comparison-verify
  cancel-in-progress: true

jobs:
  windows-native-comparison:
    runs-on: windows-latest
    env:
      GOFLAGS: -buildvcs=false
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          check-latest: false

      - name: Reconstruct and verify staged source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $chunks = Get-ChildItem 'source/current/chunk_*.b64' | Sort-Object Name
          if ($chunks.Count -lt 1) { throw 'No staged source chunks found.' }
          $text = ($chunks | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes((Join-Path $PWD 'nightview-source.tar.gz'), [Convert]::FromBase64String($text))
          $actual = (Get-FileHash nightview-source.tar.gz -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = ((Get-Content STAGED_SOURCE_SHA256_1_5.txt -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Staged source SHA-256 mismatch: $actual != $expected"
          }
          "STAGED_SOURCE_SHA256=$actual" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force buildsrc | Out-Null
          tar -xzf nightview-source.tar.gz -C buildsrc

      - name: Require exact comparison and cache tests
        shell: pwsh
        working-directory: buildsrc
        run: |
          $ErrorActionPreference = 'Stop'
          $tests = (& go test -list 'TestCompareSplitClamp|TestCompareDimensionRelation|TestAICompareNativeSplitRendering|TestAICache' . 2>&1 | Out-String)
          Write-Host $tests
          if ($LASTEXITCODE -ne 0) { throw 'Could not enumerate NightView 1.5 tests.' }
          foreach ($required in @(
            'TestCompareSplitClamp',
            'TestCompareDimensionRelation',
            'TestAICompareNativeSplitRendering',
            'TestAICacheKeyChangesByScale',
            'TestAICacheValidatesDimensionsAndCopiesWithoutOverwrite'
          )) {
            if ($tests -notmatch [regex]::Escape($required)) {
              throw "Required test missing: $required"
            }
          }

      - name: Build exact Windows candidates and fixtures
        shell: pwsh
        working-directory: buildsrc
        run: |
          $ErrorActionPreference = 'Stop'
          go build -trimpath -ldflags="-s -w -buildid= -H=windowsgui -X main.version=1.5.0" -o ..\NightView.exe .
          go build -trimpath -ldflags="-s -w -buildid= -H=windowsgui -X main.version=1.0.0" -o ..\NightViewUpdater.exe .\updater
          go build -trimpath -ldflags="-s -w -buildid= -H=windowsgui" -o ..\NightViewTestSuccess.exe .\updater\testfixture_success
          go build -trimpath -ldflags="-s -w -buildid= -H=windowsgui" -o ..\NightViewTestFailure.exe .\updater\testfixture_failure
          go build -trimpath -ldflags="-s -w -buildid= -H=windowsgui" -o ..\NightViewAITestEngine.exe .\ai\testfixture_engine
          New-Item -ItemType Directory -Force .\installer\payload | Out-Null
          Copy-Item ..\NightView.exe .\installer\payload\NightView.exe -Force
          Copy-Item ..\NightViewUpdater.exe .\installer\payload\NightViewUpdater.exe -Force

      - name: Run native split-rendering, cache, and regression tests
        shell: pwsh
        working-directory: buildsrc
        run: |
          $ErrorActionPreference = 'Stop'
          $env:NIGHTVIEW_RELEASE_PE = (Resolve-Path ..\NightView.exe).Path
          $env:NIGHTVIEW_UPDATER_PE = (Resolve-Path ..\NightViewUpdater.exe).Path
          $env:NIGHTVIEW_TARGET_PE = $env:NIGHTVIEW_RELEASE_PE
          $env:NIGHTVIEW_UPDATER_BUILT = $env:NIGHTVIEW_UPDATER_PE
          $env:NIGHTVIEW_SUCCESS_PE = (Resolve-Path ..\NightViewTestSuccess.exe).Path
          $env:NIGHTVIEW_FAILURE_PE = (Resolve-Path ..\NightViewTestFailure.exe).Path
          $env:NIGHTVIEW_AI_FIXTURE = (Resolve-Path ..\NightViewAITestEngine.exe).Path

          Write-Host '--- NightView 1.5 focused tests ---'
          go test -count=1 -v -run 'TestCompareSplitClamp|TestCompareDimensionRelation|TestAICompareNativeSplitRendering|TestAICache' .
          if ($LASTEXITCODE -ne 0) { throw 'NightView 1.5 focused tests failed.' }

          Write-Host '--- Full Windows regression suite ---'
          go test -count=1 ./...
          if ($LASTEXITCODE -ne 0) { throw 'Windows regression suite failed.' }
          go vet -unsafeptr=false ./...
          if ($LASTEXITCODE -ne 0) { throw 'Windows go vet failed.' }

      - name: Build setup from verified payload
        shell: pwsh
        working-directory: buildsrc
        run: |
          $ErrorActionPreference = 'Stop'
          go build -trimpath -ldflags="-s -w -buildid= -H=windowsgui" -o ..\NightViewSetup.exe .\installer
          foreach ($p in @('..\NightView.exe','..\NightViewUpdater.exe','..\NightViewSetup.exe')) {
            if ((Get-Item $p).Length -le 0) { throw "Empty binary: $p" }
            Get-FileHash $p -Algorithm SHA256
          }

      - name: Report verified staged source
        shell: pwsh
        run: |
          Write-Host "VERIFIED_STAGED_SOURCE_SHA256=$env:STAGED_SOURCE_SHA256"
