name: Inspect NightView AI format inputs 1.6.13
on:
  push:
    branches: [main]
    paths: [.github/workflows/inspect-nightview-ai-formats-1-6-13.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct verified source and inspect AI implementation
        shell: bash
        run: |
          set -euo pipefail
          cat source/current/chunk_*.b64 | base64 -d > /tmp/nightview-source.tar.gz
          sha256sum -c <(sed 's/nightview-source.tar.gz/\/tmp\/nightview-source.tar.gz/' SOURCE_SHA256.txt)
          mkdir /tmp/nightview-v1src
          tar -xzf /tmp/nightview-source.tar.gz -C /tmp/nightview-v1src
          echo "=== VERSION ==="
          cat VERSION
          echo "=== GO PACKAGE ==="
          cat /tmp/nightview-v1src/go.mod | head -35
          echo "=== AI SUPPORTED TYPES ==="
          grep -nER -C 8 'aiInputSupported|JPG/JPEG/PNG|func .*startAIUpscale|func .*runAIUpscale|func .*commitAIOutput|func .*saveAI4KAsPNG|func .*transcodeWebPToTempPNG|func .*decode|func .*prepare.*AI|func .*startAI' /tmp/nightview-v1src --include='*.go' | head -n 310 || true
          echo "=== AI WINDOWS FULL SOURCE (first 300 lines) ==="
          sed -n '1,300p' /tmp/nightview-v1src/ai_windows.go
          echo "=== AI CORE REFERENCES ==="
          grep -nER -C 4 'func aiInputSupported|func .*ai.*Input|transcodeWebPToTempPNG|commitAIOutput|runAIUpscale' /tmp/nightview-v1src --include='*.go' | head -n 200 || true
          echo "=== AI WINDOWS IMPORTS ==="
          sed -n '1,100p' /tmp/nightview-v1src/ai_windows.go
          echo "=== FORMAT TRANSCODER ==="
          sed -n '1690,1800p' /tmp/nightview-v1src/main_windows.go
          echo "=== AI SAVE CHOICE ==="
          sed -n '1,235p' /tmp/nightview-v1src/ai_save_windows.go
          echo "=== AI CORE INPUT AND OUTPUT ==="
          sed -n '135,260p' /tmp/nightview-v1src/ai_core.go
          echo "=== AI TEST REFERENCES ==="
          grep -nE -C 3 'overwriteAI4KOriginal|chooseAI4KSavePath|aiInputSupported|validateAIUpscaleDimensions|nextAIOutputPath' /tmp/nightview-v1src/*test.go | head -n 160 || true
          echo "=== SOURCE FILES ==="
          find /tmp/nightview-v1src -maxdepth 2 -name '*.go' -printf '%P\n' | head -70
