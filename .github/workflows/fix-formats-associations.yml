name: Fix formats and Explorer associations

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-formats-associations.yml
      - scripts/patch_1_6_7.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightview-1-6-7-fix
  cancel-in-progress: true

jobs:
  patch-build-test-stage:
    runs-on: windows-latest
    env:
      GOFLAGS: -buildvcs=false
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          check-latest: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct and verify 1.6.6 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $chunks = Get-ChildItem 'source/current/chunk_*.b64' | Sort-Object Name
          if ($chunks.Count -lt 1) { throw 'No staged source chunks found.' }
          $text = ($chunks | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes((Join-Path $PWD 'nightview-source.tar.gz'), [Convert]::FromBase64String($text))
          $expected = ((Get-Content SOURCE_SHA256.txt -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash nightview-source.tar.gz -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Current source SHA-256 mismatch: $actual != $expected" }
          New-Item -ItemType Directory -Force buildsrc | Out-Null
          tar -xzf nightview-source.tar.gz -C buildsrc
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -ne '1.6.6') { throw "Expected source version 1.6.6, found $version" }

      - name: Apply 1.6.7 fixes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts\patch_1_6_7.py buildsrc

          python -m pip install --disable-pip-version-check --quiet pillow
          New-Item -ItemType Directory -Force buildsrc\testdata | Out-Null
          @'
          from PIL import Image
          img = Image.new("RGBA", (7, 5), (23, 87, 151, 255))
          img.save(r"buildsrc\testdata\tiny.webp", format="WEBP", lossless=True)
          '@ | python -

          Push-Location buildsrc
          go get golang.org/x/image@v0.25.0
          go mod tidy
          gofmt -w core.go main_windows.go association_migration_windows.go association_migration_windows_test.go webp_core_test.go webp_windows_test.go installer\association_core.go installer\association_windows.go installer\association_windows_test.go installer\main_windows.go
          Pop-Location

          $core = Get-Content buildsrc\core.go -Raw
          $main = Get-Content buildsrc\main_windows.go -Raw
          $assoc = Get-Content buildsrc\installer\association_windows.go -Raw
          $migration = Get-Content buildsrc\association_migration_windows.go -Raw

          foreach ($needle in @('".webp": {}','golang.org/x/image/webp','golang.org/x/image/bmp','golang.org/x/image/tiff')) {
            if (-not $core.Contains($needle)) { throw "Missing format support: $needle" }
          }
          foreach ($needle in @('transcodeWebPToTempPNG','*.webp','지원: JPG/JPEG, PNG, GIF, BMP/DIB, TIFF, ICO, WEBP','tempPath')) {
            if (-not $main.Contains($needle)) { throw "Missing WEBP viewer behavior: $needle" }
          }
          if ($assoc.Contains('regAddDefault(base+"\\"+ext, progID)')) {
            throw 'Unsafe extension default ProgID overwrite still exists in installer'
          }
          foreach ($needle in @('removeLegacyDefaultIfEquals','OpenWithProgids','registerCapabilitiesAt','RegisteredApplications')) {
            if (-not $assoc.Contains($needle)) { throw "Missing safe association behavior: $needle" }
          }
          foreach ($needle in @('repairImageAssociationsAt','migrationRemoveDefaultIfEquals','OpenWithProgids','associationMigrationMarker')) {
            if (-not $migration.Contains($needle)) { throw "Missing in-app association migration: $needle" }
          }

      - name: Build and run full regression suite
        shell: pwsh
        working-directory: buildsrc
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '1.6.7'

          go build -trimpath -ldflags="-s -w -buildid= -H=windowsgui -X main.version=$version" -o ..\NightView.exe .
          go build -trimpath -ldflags="-s -w -buildid= -H=windowsgui -X main.version=1.0.0" -o ..\NightViewUpdater.exe .\updater
          go build -trimpath -ldflags="-s -w -buildid= -H=windowsgui" -o ..\NightViewTestSuccess.exe .\updater\testfixture_success
          go build -trimpath -ldflags="-s -w -buildid= -H=windowsgui" -o ..\NightViewTestFailure.exe .\updater\testfixture_failure
          go build -trimpath -ldflags="-s -w -buildid= -H=windowsgui" -o ..\NightViewAITestEngine.exe .\ai\testfixture_engine

          $env:NIGHTVIEW_RELEASE_PE = (Resolve-Path ..\NightView.exe).Path
          $env:NIGHTVIEW_UPDATER_PE = (Resolve-Path ..\NightViewUpdater.exe).Path
          $env:NIGHTVIEW_TARGET_PE = $env:NIGHTVIEW_RELEASE_PE
          $env:NIGHTVIEW_UPDATER_BUILT = $env:NIGHTVIEW_UPDATER_PE
          $env:NIGHTVIEW_SUCCESS_PE = (Resolve-Path ..\NightViewTestSuccess.exe).Path
          $env:NIGHTVIEW_FAILURE_PE = (Resolve-Path ..\NightViewTestFailure.exe).Path
          $env:NIGHTVIEW_AI_FIXTURE = (Resolve-Path ..\NightViewAITestEngine.exe).Path

          go test -count=1 .\...
          go vet -unsafeptr=false .\...

      - name: Repack verified 1.6.7 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location buildsrc
          tar -czf ..\nightview-source-1.6.7.tar.gz *
          Pop-Location

          $hash = (Get-FileHash 'nightview-source-1.6.7.tar.gz' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  nightview-source.tar.gz" | Set-Content 'SOURCE_SHA256.txt' -Encoding ascii
          "$hash  nightview-source.tar.gz" | Set-Content 'STAGED_SOURCE_SHA256_1_6_7.txt' -Encoding ascii
          "1.6.7" | Set-Content 'VERSION' -Encoding ascii

          $notes = @(
            'NightView 1.6.7',
            '- WEBP 이미지 실제 열기/폴더 탐색/해상도 판독 지원 추가',
            '- JPG/JPEG/JFIF, PNG, GIF, BMP/DIB, TIFF, ICO 기존 지원 유지',
            '- 이미지 열기 파일 선택창과 지원 형식 안내에 WEBP 반영',
            '- Windows 탐색기 이미지 확장자의 기존 기본 ProgID를 NightView가 더 이상 강제로 덮어쓰지 않음',
            '- NightView는 OpenWithProgids 및 RegisteredApplications/Capabilities 방식으로 안전하게 연결 프로그램 등록',
            '- 1.6.6 이하가 남긴 JPG/PNG 등 NightView.Image 강제 기본 연결값은 1.6.7 첫 실행 시 NightView 값일 때만 제거',
            '- 기존 Windows 이미지 형식/썸네일 등록을 보존하도록 NightView.Image DefaultIcon 강제 등록 제거',
            '- 인앱 업데이트 사용자도 재설치 없이 첫 실행 시 파일 연결 구조를 자동 복구',
            '- 기존 전체화면 상단 툴바, 창 제어, AI 4K 저장 선택/원본 비교, 업데이트/롤백 기능 유지'
          ) -join [Environment]::NewLine
          [IO.File]::WriteAllText((Join-Path $PWD 'RELEASE_NOTES.txt'), $notes + [Environment]::NewLine, (New-Object Text.UTF8Encoding($false)))

          $bytes = [IO.File]::ReadAllBytes((Join-Path $PWD 'nightview-source-1.6.7.tar.gz'))
          $b64 = [Convert]::ToBase64String($bytes)
          Get-ChildItem 'source/current/chunk_*.b64' -ErrorAction SilentlyContinue | Remove-Item -Force
          $chunkSize = 8000
          $index = 0
          for ($offset = 0; $offset -lt $b64.Length; $offset += $chunkSize) {
            $length = [Math]::Min($chunkSize, $b64.Length - $offset)
            $part = $b64.Substring($offset, $length)
            $name = ('source/current/chunk_{0:D4}.b64' -f $index)
            [IO.File]::WriteAllText((Join-Path $PWD $name), $part, (New-Object Text.UTF8Encoding($false)))
            $index++
          }
          Write-Host "Staged 1.6.7 source SHA-256: $hash"
          Write-Host "Wrote $index source chunks."

      - name: Commit verified 1.6.7 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/current SOURCE_SHA256.txt STAGED_SOURCE_SHA256_1_6_7.txt VERSION RELEASE_NOTES.txt
          if (git diff --cached --quiet) { throw 'No verified changes were produced.' }
          git commit -m 'Release NightView 1.6.7 WEBP and safe associations'
          git push
