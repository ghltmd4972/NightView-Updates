name: Inspect NightView delete integration 1.6.12

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-delete-1-6-12.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $chunks = Get-ChildItem 'source/current/chunk_*.b64' | Sort-Object Name
          $text = ($chunks | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes((Join-Path $PWD 'source.tar.gz'), [Convert]::FromBase64String($text))
          New-Item -ItemType Directory -Force buildsrc | Out-Null
          tar -xzf source.tar.gz -C buildsrc
      - name: Inspect key and navigation paths
        shell: pwsh
        working-directory: buildsrc
        run: |
          $ErrorActionPreference = 'Stop'
          $lines = Get-Content main_windows.go

          function PrintAround([string]$pattern, [int]$before=20, [int]$after=100) {
            for($i=0;$i -lt $lines.Count;$i++) {
              if($lines[$i] -match $pattern) {
                Write-Host ("=== " + $pattern + " @ " + ($i+1) + " ===")
                $s=[Math]::Max(0,$i-$before); $e=[Math]::Min($lines.Count-1,$i+$after)
                for($k=$s;$k -le $e;$k++){ Write-Host ("{0:D4}: {1}" -f ($k+1),$lines[$k]) }
              }
            }
          }

          PrintAround 'case WM_KEYDOWN'
          PrintAround 'VK_DELETE|VK_LEFT|VK_RIGHT|VK_ESCAPE|VK_BACK'
          PrintAround '^func \(a \*viewerApp\) navigate'
          PrintAround '^func \(a \*viewerApp\) move'
          PrintAround '^func \(a \*viewerApp\) next'
          PrintAround 'currentIndex'
          PrintAround 'disposeCurrentImage'
