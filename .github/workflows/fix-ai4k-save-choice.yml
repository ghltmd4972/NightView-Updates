name: Add AI 4K save choice

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-ai4k-save-choice.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightview-ai4k-save-choice
  cancel-in-progress: true

jobs:
  patch-build-test-stage:
    runs-on: windows-latest
    env:
      GOFLAGS: -buildvcs=false
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          check-latest: false

      - name: Reconstruct and verify current source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $chunks = Get-ChildItem 'source/current/chunk_*.b64' | Sort-Object Name
          if ($chunks.Count -lt 1) { throw 'No staged source chunks found.' }
          $text = ($chunks | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes((Join-Path $PWD 'nightview-source.tar.gz'), [Convert]::FromBase64String($text))
          $expected = ((Get-Content SOURCE_SHA256.txt -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash nightview-source.tar.gz -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Current source SHA-256 mismatch: $actual != $expected" }
          New-Item -ItemType Directory -Force buildsrc | Out-Null
          tar -xzf nightview-source.tar.gz -C buildsrc
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -ne '1.6.3') { throw "Expected source version 1.6.3, found $version" }

      - name: Patch AI 4K flow
        shell: pwsh
        working-directory: buildsrc
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'ai_windows.go'
          $src = Get-Content $path -Raw

          $oldCache = @'
	if cached, ok := findValidAICache(localData, input, sourceSHA, scale, m); ok {
		finalPath, copyErr := commitAICachedOutput(cached, input, scale)
		if copyErr == nil {
			a.finishAIUpscale(finalPath, sourceSHA, true, nil)
			return
		}
	}
'@
          $newCache = @'
	if cached, ok := findValidAICache(localData, input, sourceSHA, scale, m); ok {
		if scale == 4 {
			pendingPath, copyErr := stageAI4KResult(localData, cached)
			if copyErr == nil {
				a.finishAIUpscale(pendingPath, sourceSHA, true, nil)
				return
			}
		} else {
			finalPath, copyErr := commitAICachedOutput(cached, input, scale)
			if copyErr == nil {
				a.finishAIUpscale(finalPath, sourceSHA, true, nil)
				return
			}
		}
	}
'@
          if (-not $src.Contains($oldCache)) { throw 'AI cache commit block not found.' }
          $src = $src.Replace($oldCache, $newCache)

          $oldCommit = @'
	finalPath, err := commitAIOutput(tmpOutput, input, scale)
	if err != nil {
		a.finishAIUpscale("", sourceSHA, false, fmt.Errorf("AI 결과 저장 실패: %w", err))
		return
	}
	a.finishAIUpscale(finalPath, sourceSHA, false, nil)
'@
          $newCommit = @'
	if scale == 4 {
		pendingPath, err := stageAI4KResult(localData, tmpOutput)
		if err != nil {
			a.finishAIUpscale("", sourceSHA, false, fmt.Errorf("AI 4K 결과 준비 실패: %w", err))
			return
		}
		a.finishAIUpscale(pendingPath, sourceSHA, false, nil)
		return
	}

	finalPath, err := commitAIOutput(tmpOutput, input, scale)
	if err != nil {
		a.finishAIUpscale("", sourceSHA, false, fmt.Errorf("AI 결과 저장 실패: %w", err))
		return
	}
	a.finishAIUpscale(finalPath, sourceSHA, false, nil)
'@
          if (-not $src.Contains($oldCommit)) { throw 'AI final commit block not found.' }
          $src = $src.Replace($oldCommit, $newCommit)

          $pattern = '(?ms)^func \(a \*viewerApp\) onAIUpscaleDone\(\) \{.*?^\}\r?\n(?=func \(a \*viewerApp\) onAIUpscaleError\(\))'
          $matches = [regex]::Matches($src, $pattern)
          if ($matches.Count -ne 1) { throw "Expected exactly one onAIUpscaleDone function, found $($matches.Count)." }

          $newDone = @'
func (a *viewerApp) onAIUpscaleDone() {
	aiUpscales.mu.Lock()
	result := aiUpscales.resultPath
	input := aiUpscales.inputPath
	inputSHA := aiUpscales.inputSHA
	scale := aiUpscales.scale
	cacheHit := aiUpscales.cacheHit
	aiUpscales.mu.Unlock()
	if result == "" {
		a.onAIUpscaleErrorText("AI 결과 파일 경로가 비어 있습니다.")
		return
	}

	if scale != 4 {
		a.setAICompareCandidate(input, result, scale, inputSHA)
		a.openImagePath(result)
		cacheNote := ""
		if cacheHit {
			cacheNote = "\n\n같은 원본/배율의 검증된 캐시를 사용해 AI를 다시 실행하지 않았습니다."
		}
		messageBox(a.hwnd, fmt.Sprintf("AI %d× 업스케일이 완료되었습니다.\n\n%s\n\n원본 파일은 변경하지 않았습니다.%s\n\nC 키로 원본과 AI 결과를 비교할 수 있습니다.", scale, result, cacheNote), "NightView AI 업스케일", MB_OK|MB_ICONINFO)
		return
	}

	defer os.Remove(result)

	cacheNote := ""
	if cacheHit {
		cacheNote = "\n\n같은 원본/배율의 검증된 캐시를 사용했습니다."
	}
	prompt := "AI 4× 변환이 완료되었습니다.\n\n저장 방법을 선택하세요.\n\n예: 원본에 덮어쓰기\n아니요: 다른 이름으로 저장\n취소: 저장하지 않음" + cacheNote
	choice := messageBoxResult(a.hwnd, prompt, "NightView AI 4K 저장", aiMBYesNoCancel|MB_ICONINFO)

	savedPath := ""
	switch choice {
	case IDYES:
		wasCurrent := strings.EqualFold(filepath.Clean(a.currentPath), filepath.Clean(input))
		if wasCurrent {
			a.disposeCurrentImage()
		}
		if err := overwriteAI4KOriginal(result, input); err != nil {
			if wasCurrent {
				a.openImagePath(input)
			}
			a.onAIUpscaleErrorText("원본 파일에 덮어쓰지 못했습니다.\n\n" + err.Error())
			return
		}
		savedPath = input
	case aiIDNo:
		target, ok := a.chooseAI4KSavePath(input)
		if !ok {
			a.restoreTitleAfterAIChoice()
			return
		}
		if err := saveAI4KAsPNG(result, target); err != nil {
			a.onAIUpscaleErrorText("AI 4K 결과를 저장하지 못했습니다.\n\n" + err.Error())
			return
		}
		savedPath = target
	default:
		a.restoreTitleAfterAIChoice()
		return
	}

	if !strings.EqualFold(filepath.Clean(savedPath), filepath.Clean(input)) {
		a.setAICompareCandidate(input, savedPath, scale, inputSHA)
	}
	a.openImagePath(savedPath)

	if strings.EqualFold(filepath.Clean(savedPath), filepath.Clean(input)) {
		messageBox(a.hwnd, "AI 4K 결과를 원본 파일에 덮어썼습니다.\n\n"+savedPath, "NightView AI 4K", MB_OK|MB_ICONINFO)
	} else {
		messageBox(a.hwnd, "AI 4K 결과를 저장했습니다.\n\n"+savedPath+"\n\nC 키로 원본과 AI 결과를 비교할 수 있습니다.", "NightView AI 4K", MB_OK|MB_ICONINFO)
	}
}
'@
          $src = [regex]::Replace($src, $pattern, $newDone + [Environment]::NewLine)
          [IO.File]::WriteAllText((Join-Path $PWD $path), $src, (New-Object Text.UTF8Encoding($false)))

      - name: Add AI 4K save helpers and tests
        shell: pwsh
        working-directory: buildsrc
        run: |
          $ErrorActionPreference = 'Stop'

          $helper = @'
//go:build windows

package main

import (
	"errors"
	"fmt"
	"image/jpeg"
	"image/png"
	"os"
	"path/filepath"
	"strings"
	"syscall"
	"unicode/utf16"
	"unsafe"
)

const (
	aiMBYesNoCancel      = 0x00000003
	aiIDNo               = 7
	aiOFNOverwritePrompt = 0x00000002
	aiMoveReplace        = 0x00000001
	aiMoveWriteThrough   = 0x00000008
)

var (
	pGetSaveFileNameAI = comdlg32.NewProc("GetSaveFileNameW")
	pMoveFileExAI       = kernel32.NewProc("MoveFileExW")
)

func ai4KPendingDir(localData string) string {
	return filepath.Join(localData, "ai-pending")
}

func stageAI4KResult(localData, src string) (string, error) {
	dir := ai4KPendingDir(localData)
	if err := os.MkdirAll(dir, 0o755); err != nil {
		return "", err
	}
	f, err := os.CreateTemp(dir, "nightview-ai4k-*.png")
	if err != nil {
		return "", err
	}
	dst := f.Name()
	if err := f.Close(); err != nil {
		_ = os.Remove(dst)
		return "", err
	}
	_ = os.Remove(dst)
	if err := copyFileExclusive(src, dst); err != nil {
		return "", err
	}
	if err := validateAIUpscaleOutput(dst); err != nil {
		_ = os.Remove(dst)
		return "", err
	}
	return dst, nil
}

func utf16DialogString(s string) []uint16 {
	out := utf16.Encode([]rune(s))
	return append(out, 0)
}

func (a *viewerApp) chooseAI4KSavePath(input string) (string, bool) {
	filter := utf16DialogString("PNG 이미지 (*.png)\x00*.png\x00모든 파일 (*.*)\x00*.*\x00\x00")
	title := mustUTF16("AI 4K 결과를 다른 이름으로 저장")
	defExt := mustUTF16("png")
	initialDir := mustUTF16(filepath.Dir(input))

	for {
		buf := make([]uint16, 32768)
		initialName := utf16DialogString(nextAIOutputPath(input, 4))
		copy(buf, initialName)

		ofn := OPENFILENAME{
			LStructSize:    uint32(unsafe.Sizeof(OPENFILENAME{})),
			HwndOwner:      a.hwnd,
			LpstrFilter:    &filter[0],
			NFilterIndex:   1,
			LpstrFile:      &buf[0],
			NMaxFile:       uint32(len(buf)),
			LpstrInitialDir: initialDir,
			LpstrTitle:     title,
			Flags:          OFN_PATHMUSTEXIST | OFN_EXPLORER | aiOFNOverwritePrompt,
			LpstrDefExt:    defExt,
		}
		if r, _, _ := pGetSaveFileNameAI.Call(uintptr(unsafe.Pointer(&ofn))); r == 0 {
			return "", false
		}
		target := filepath.Clean(syscall.UTF16ToString(buf))
		if filepath.Ext(target) == "" {
			target += ".png"
		}
		if !strings.EqualFold(filepath.Ext(target), ".png") {
			messageBox(a.hwnd, "AI 4K 결과는 PNG 파일로 저장됩니다.\n\n파일 확장자를 .png로 지정해주세요.", "NightView AI 4K", MB_OK|MB_ICONINFO)
			continue
		}
		if strings.EqualFold(filepath.Clean(target), filepath.Clean(input)) {
			messageBox(a.hwnd, "원본과 같은 경로는 '다른 이름으로 저장'에 사용할 수 없습니다.\n\n원본에 저장하려면 '원본에 덮어쓰기'를 선택해주세요.", "NightView AI 4K", MB_OK|MB_ICONINFO)
			continue
		}
		return target, true
	}
}

func (a *viewerApp) restoreTitleAfterAIChoice() {
	if a.currentPath != "" {
		a.setTitle(filepath.Base(a.currentPath) + " — NightView")
	} else {
		a.setTitle("NightView")
	}
}

func moveFileReplace(src, dst string) error {
	src16, err := syscall.UTF16PtrFromString(src)
	if err != nil {
		return err
	}
	dst16, err := syscall.UTF16PtrFromString(dst)
	if err != nil {
		return err
	}
	r, _, callErr := pMoveFileExAI.Call(
		uintptr(unsafe.Pointer(src16)),
		uintptr(unsafe.Pointer(dst16)),
		aiMoveReplace|aiMoveWriteThrough,
	)
	if r == 0 {
		return callErr
	}
	return nil
}

func atomicCopyPNG(src, dst string) error {
	if !strings.EqualFold(filepath.Ext(dst), ".png") {
		return errors.New("destination must use .png")
	}
	if err := os.MkdirAll(filepath.Dir(dst), 0o755); err != nil {
		return err
	}
	f, err := os.CreateTemp(filepath.Dir(dst), ".nightview-save-*.png")
	if err != nil {
		return err
	}
	tmp := f.Name()
	if err := f.Close(); err != nil {
		_ = os.Remove(tmp)
		return err
	}
	_ = os.Remove(tmp)
	if err := copyFileExclusive(src, tmp); err != nil {
		return err
	}
	ok := false
	defer func() {
		if !ok {
			_ = os.Remove(tmp)
		}
	}()
	if err := validateAIUpscaleOutput(tmp); err != nil {
		return err
	}
	if err := moveFileReplace(tmp, dst); err != nil {
		return err
	}
	ok = true
	return nil
}

func saveAI4KAsPNG(src, dst string) error {
	return atomicCopyPNG(src, dst)
}

func overwriteAI4KOriginal(src, original string) error {
	switch strings.ToLower(filepath.Ext(original)) {
	case ".png":
		return atomicCopyPNG(src, original)
	case ".jpg", ".jpeg", ".jpe", ".jfif":
		return overwriteAI4KJPEG(src, original)
	default:
		return fmt.Errorf("지원하지 않는 원본 형식입니다: %s", filepath.Ext(original))
	}
}

func overwriteAI4KJPEG(src, original string) error {
	in, err := os.Open(src)
	if err != nil {
		return err
	}
	img, err := png.Decode(in)
	_ = in.Close()
	if err != nil {
		return fmt.Errorf("AI PNG 읽기 실패: %w", err)
	}

	f, err := os.CreateTemp(filepath.Dir(original), ".nightview-overwrite-*.jpg")
	if err != nil {
		return err
	}
	tmp := f.Name()
	ok := false
	defer func() {
		_ = f.Close()
		if !ok {
			_ = os.Remove(tmp)
		}
	}()
	if err := jpeg.Encode(f, img, &jpeg.Options{Quality: 100}); err != nil {
		return fmt.Errorf("JPEG 변환 실패: %w", err)
	}
	if err := f.Sync(); err != nil {
		return err
	}
	if err := f.Close(); err != nil {
		return err
	}
	cfg, format, err := imageConfig(tmp)
	if err != nil {
		return err
	}
	if format != "jpeg" || cfg.Width <= 0 || cfg.Height <= 0 {
		return errors.New("변환된 JPEG 검증 실패")
	}
	if err := moveFileReplace(tmp, original); err != nil {
		return err
	}
	ok = true
	return nil
}
'@
          [IO.File]::WriteAllText((Join-Path $PWD 'ai_save_windows.go'), $helper, (New-Object Text.UTF8Encoding($false)))

          $tests = @'
//go:build windows

package main

import (
	"image"
	"image/color"
	"image/jpeg"
	"image/png"
	"os"
	"path/filepath"
	"testing"
)

func writeAI4KTestPNG(t *testing.T, path string, w, h int, c color.Color) {
	t.Helper()
	f, err := os.Create(path)
	if err != nil {
		t.Fatal(err)
	}
	img := image.NewRGBA(image.Rect(0, 0, w, h))
	for y := 0; y < h; y++ {
		for x := 0; x < w; x++ {
			img.Set(x, y, c)
		}
	}
	if err := png.Encode(f, img); err != nil {
		_ = f.Close()
		t.Fatal(err)
	}
	if err := f.Close(); err != nil {
		t.Fatal(err)
	}
}

func writeAI4KTestJPEG(t *testing.T, path string, w, h int) {
	t.Helper()
	f, err := os.Create(path)
	if err != nil {
		t.Fatal(err)
	}
	img := image.NewRGBA(image.Rect(0, 0, w, h))
	if err := jpeg.Encode(f, img, &jpeg.Options{Quality: 90}); err != nil {
		_ = f.Close()
		t.Fatal(err)
	}
	if err := f.Close(); err != nil {
		t.Fatal(err)
	}
}

func TestStageAI4KResultUsesAppDataArea(t *testing.T) {
	root := t.TempDir()
	sourceDir := filepath.Join(root, "source")
	localData := filepath.Join(root, "local")
	if err := os.MkdirAll(sourceDir, 0o755); err != nil {
		t.Fatal(err)
	}
	src := filepath.Join(sourceDir, "result.png")
	writeAI4KTestPNG(t, src, 16, 12, color.RGBA{R: 255, A: 255})
	got, err := stageAI4KResult(localData, src)
	if err != nil {
		t.Fatal(err)
	}
	defer os.Remove(got)
	if filepath.Dir(got) != ai4KPendingDir(localData) {
		t.Fatalf("pending result stored in wrong directory: %s", got)
	}
	if filepath.Dir(got) == sourceDir {
		t.Fatal("4K pending result was written next to the original")
	}
}

func TestSaveAI4KAsPNGPreservesOriginal(t *testing.T) {
	d := t.TempDir()
	result := filepath.Join(d, "pending.png")
	original := filepath.Join(d, "original.png")
	dst := filepath.Join(d, "saved.png")
	writeAI4KTestPNG(t, result, 20, 10, color.RGBA{G: 255, A: 255})
	writeAI4KTestPNG(t, original, 5, 5, color.RGBA{R: 255, A: 255})
	before, err := os.ReadFile(original)
	if err != nil {
		t.Fatal(err)
	}
	if err := saveAI4KAsPNG(result, dst); err != nil {
		t.Fatal(err)
	}
	after, err := os.ReadFile(original)
	if err != nil {
		t.Fatal(err)
	}
	if string(before) != string(after) {
		t.Fatal("save-as modified the original")
	}
	cfg, format, err := imageConfig(dst)
	if err != nil {
		t.Fatal(err)
	}
	if format != "png" || cfg.Width != 20 || cfg.Height != 10 {
		t.Fatalf("unexpected saved output: format=%s size=%dx%d", format, cfg.Width, cfg.Height)
	}
}

func TestOverwriteAI4KOriginalPNG(t *testing.T) {
	d := t.TempDir()
	result := filepath.Join(d, "pending.png")
	original := filepath.Join(d, "original.png")
	writeAI4KTestPNG(t, result, 24, 16, color.RGBA{B: 255, A: 255})
	writeAI4KTestPNG(t, original, 6, 4, color.RGBA{R: 255, A: 255})
	if err := overwriteAI4KOriginal(result, original); err != nil {
		t.Fatal(err)
	}
	cfg, format, err := imageConfig(original)
	if err != nil {
		t.Fatal(err)
	}
	if format != "png" || cfg.Width != 24 || cfg.Height != 16 {
		t.Fatalf("unexpected overwritten PNG: format=%s size=%dx%d", format, cfg.Width, cfg.Height)
	}
}

func TestOverwriteAI4KOriginalJPEGKeepsJPEGFormat(t *testing.T) {
	d := t.TempDir()
	result := filepath.Join(d, "pending.png")
	original := filepath.Join(d, "original.jpg")
	writeAI4KTestPNG(t, result, 28, 20, color.RGBA{G: 220, B: 100, A: 255})
	writeAI4KTestJPEG(t, original, 7, 5)
	if err := overwriteAI4KOriginal(result, original); err != nil {
		t.Fatal(err)
	}
	cfg, format, err := imageConfig(original)
	if err != nil {
		t.Fatal(err)
	}
	if format != "jpeg" || cfg.Width != 28 || cfg.Height != 20 {
		t.Fatalf("unexpected overwritten JPEG: format=%s size=%dx%d", format, cfg.Width, cfg.Height)
	}
}
'@
          [IO.File]::WriteAllText((Join-Path $PWD 'ai_save_windows_test.go'), $tests, (New-Object Text.UTF8Encoding($false)))

          gofmt -w ai_windows.go ai_save_windows.go ai_save_windows_test.go

          $ai = Get-Content ai_windows.go -Raw
          if (-not $ai.Contains('if scale == 4 {')) { throw '4K deferred-save branch missing.' }
          if (-not $ai.Contains('aiMBYesNoCancel')) { throw '4K save-choice prompt missing.' }
          if (-not $ai.Contains('chooseAI4KSavePath')) { throw 'Save As path missing.' }
          if (-not $ai.Contains('overwriteAI4KOriginal')) { throw 'Overwrite path missing.' }
          if (-not $ai.Contains('취소: 저장하지 않음')) { throw 'Cancel choice text missing.' }

      - name: Build and run regression tests
        shell: pwsh
        working-directory: buildsrc
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '1.6.4'
          go build -trimpath -ldflags="-s -w -buildid= -H=windowsgui -X main.version=$version" -o ..\NightView.exe .
          go build -trimpath -ldflags="-s -w -buildid= -H=windowsgui -X main.version=1.0.0" -o ..\NightViewUpdater.exe .\updater
          go build -trimpath -ldflags="-s -w -buildid= -H=windowsgui" -o ..\NightViewTestSuccess.exe .\updater\testfixture_success
          go build -trimpath -ldflags="-s -w -buildid= -H=windowsgui" -o ..\NightViewTestFailure.exe .\updater\testfixture_failure
          go build -trimpath -ldflags="-s -w -buildid= -H=windowsgui" -o ..\NightViewAITestEngine.exe .\ai\testfixture_engine

          $env:NIGHTVIEW_RELEASE_PE = (Resolve-Path ..\NightView.exe).Path
          $env:NIGHTVIEW_UPDATER_PE = (Resolve-Path ..\NightViewUpdater.exe).Path
          $env:NIGHTVIEW_TARGET_PE = $env:NIGHTVIEW_RELEASE_PE
          $env:NIGHTVIEW_UPDATER_BUILT = $env:NIGHTVIEW_UPDATER_PE
          $env:NIGHTVIEW_SUCCESS_PE = (Resolve-Path ..\NightViewTestSuccess.exe).Path
          $env:NIGHTVIEW_FAILURE_PE = (Resolve-Path ..\NightViewTestFailure.exe).Path
          $env:NIGHTVIEW_AI_FIXTURE = (Resolve-Path ..\NightViewAITestEngine.exe).Path

          go test -count=1 .\...
          go vet -unsafeptr=false .\...

      - name: Repack verified source and prepare 1.6.4 release metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location buildsrc
          tar -czf ..\nightview-source-1.6.4.tar.gz *
          Pop-Location

          $hash = (Get-FileHash 'nightview-source-1.6.4.tar.gz' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  nightview-source.tar.gz" | Set-Content 'SOURCE_SHA256.txt' -Encoding ascii
          "$hash  nightview-source.tar.gz" | Set-Content 'STAGED_SOURCE_SHA256_1_6_4.txt' -Encoding ascii
          "1.6.4" | Set-Content 'VERSION' -Encoding ascii

          $notes = @(
            'NightView 1.6.4',
            '- AI 4×(4K) 변환 완료 후 자동 저장하지 않고 저장 방식을 반드시 선택',
            '- 예: 원본에 덮어쓰기',
            '- 아니요: 다른 이름으로 PNG 저장',
            '- 취소: 저장하지 않고 원본 유지',
            '- JPG/JPEG 원본 덮어쓰기 시 JPEG 형식을 유지하며 4K 결과로 교체',
            '- AI 2× 기존 저장 동작은 변경하지 않음',
            '- 기존 전체화면 시작, ESC 종료, 간소화된 업데이트, 설정 보존 및 롤백 기능 유지'
          ) -join [Environment]::NewLine
          [IO.File]::WriteAllText((Join-Path $PWD 'RELEASE_NOTES.txt'), $notes + [Environment]::NewLine, (New-Object Text.UTF8Encoding($false)))

          $bytes = [IO.File]::ReadAllBytes((Join-Path $PWD 'nightview-source-1.6.4.tar.gz'))
          $b64 = [Convert]::ToBase64String($bytes)
          Get-ChildItem 'source/current/chunk_*.b64' -ErrorAction SilentlyContinue | Remove-Item -Force
          $chunkSize = 8000
          $index = 0
          for ($offset = 0; $offset -lt $b64.Length; $offset += $chunkSize) {
            $length = [Math]::Min($chunkSize, $b64.Length - $offset)
            $part = $b64.Substring($offset, $length)
            $name = ('source/current/chunk_{0:D4}.b64' -f $index)
            [IO.File]::WriteAllText((Join-Path $PWD $name), $part, (New-Object Text.UTF8Encoding($false)))
            $index++
          }
          Write-Host "Staged 1.6.4 source SHA-256: $hash"
          Write-Host "Wrote $index source chunks."

      - name: Commit verified 1.6.4 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/current SOURCE_SHA256.txt STAGED_SOURCE_SHA256_1_6_4.txt VERSION RELEASE_NOTES.txt
          if (git diff --cached --quiet) { throw 'No verified changes were produced.' }
          git commit -m 'Release NightView 1.6.4 AI 4K save choice'
          git push
