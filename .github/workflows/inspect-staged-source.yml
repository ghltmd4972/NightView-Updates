name: Inspect staged NightView source

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/inspect-staged-source.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $chunks = Get-ChildItem 'source/current/chunk_*.b64' | Sort-Object Name
          $text = ($chunks | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes((Join-Path $PWD 'nightview-source.tar.gz'), [Convert]::FromBase64String($text))
          New-Item -ItemType Directory -Force buildsrc | Out-Null
          tar -xzf nightview-source.tar.gz -C buildsrc
      - name: Print exact startup and updater files
        shell: pwsh
        working-directory: buildsrc
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host '=== STARTUP RANGE ==='
          $main = Get-Content main_windows.go
          for ($i=35; $i -lt [Math]::Min(435,$main.Count); $i++) {
            if (($i -ge 35 -and $i -le 60) -or ($i -ge 390 -and $i -le 430)) {
              Write-Host ("{0:D4}: {1}" -f ($i+1), $main[$i])
            }
          }
          Write-Host '=== UPDATECHECK_WINDOWS_GO ==='
          $u = Get-Content updatecheck_windows.go
          for ($i=0; $i -lt $u.Count; $i++) { Write-Host ("{0:D4}: {1}" -f ($i+1), $u[$i]) }
          Write-Host '=== UPDATER_MAIN_GO ==='
          $p = Get-Content updater/main.go
          for ($i=0; $i -lt $p.Count; $i++) { Write-Host ("{0:D4}: {1}" -f ($i+1), $p[$i]) }
