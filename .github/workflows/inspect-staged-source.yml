name: Inspect NightView window controls and AI compare

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/inspect-staged-source.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $chunks = Get-ChildItem 'source/current/chunk_*.b64' | Sort-Object Name
          $text = ($chunks | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes((Join-Path $PWD 'nightview-source.tar.gz'), [Convert]::FromBase64String($text))
          New-Item -ItemType Directory -Force buildsrc | Out-Null
          tar -xzf nightview-source.tar.gz -C buildsrc

      - name: Print window control and AI compare source
        shell: pwsh
        working-directory: buildsrc
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "VERSION=$(Get-Content ..\VERSION -Raw)"

          $files = Get-ChildItem -Recurse -File -Include '*.go' | Sort-Object FullName
          foreach ($f in $files) {
            $rel = Resolve-Path -Relative $f.FullName
            $lines = Get-Content $f.FullName

            Write-Host ("=== FILE " + $rel + " ===")
            $patterns = @(
              '^func main',
              '^func run',
              '^func .*create.*window',
              '^func .*init.*window',
              '^func \(a \*viewerApp\) buttonLayout',
              '^func \(a \*viewerApp\) drawToolbar',
              '^func \(a \*viewerApp\) activateButton',
              '^func \(a \*viewerApp\) toggleFullscreen',
              '^func \(a \*viewerApp\) onAI',
              '^func \(a \*viewerApp\) drawAI',
              '^func \(a \*viewerApp\) startAI',
              '^func \(a \*viewerApp\) endAI',
              '^func \(a \*viewerApp\) .*Upscale',
              '^type viewerApp struct',
              '^type ai',
              '^type AI'
            )

            for ($i=0; $i -lt $lines.Count; $i++) {
              $matched = $false
              foreach ($p in $patterns) {
                if ($lines[$i] -match $p) { $matched = $true; break }
              }
              if (-not $matched) { continue }

              $start = [Math]::Max(0, $i)
              $end = [Math]::Min($lines.Count-1, $i + 160)
              if ($lines[$i] -match '^func ') {
                for ($j=$i+1; $j -lt $lines.Count; $j++) {
                  if ($lines[$j] -match '^func ' -or $lines[$j] -match '^type ') {
                    $end = $j - 1
                    break
                  }
                }
              }

              Write-Host ("--- " + $rel + " line " + ($i+1) + " ---")
              for ($k=$start; $k -le $end; $k++) {
                Write-Host ("{0:D4}: {1}" -f ($k+1), $lines[$k])
              }
            }

            $needles = @(
              'CreateWindowEx',
              'WS_OVERLAPPEDWINDOW',
              'WS_POPUP',
              'SW_MINIMIZE',
              'SC_MINIMIZE',
              'ShowWindow',
              'btnFullscreen',
              'btnAI',
              'compare',
              'original',
              'upscale',
              'AI 4K',
              'ai4k'
            )
            foreach ($needle in $needles) {
              $matches = Select-String -Path $f.FullName -Pattern $needle -SimpleMatch -Context 8,16
              foreach ($m in $matches) {
                Write-Host ("--- MATCH " + $needle + " " + $rel + " line " + $m.LineNumber + " ---")
                $m.Context.PreContext | ForEach-Object { Write-Host $_ }
                Write-Host $m.Line
                $m.Context.PostContext | ForEach-Object { Write-Host $_ }
              }
            }
          }
