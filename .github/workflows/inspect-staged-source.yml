name: Inspect NightView toolbar fullscreen flow

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/inspect-staged-source.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $chunks = Get-ChildItem 'source/current/chunk_*.b64' | Sort-Object Name
          $text = ($chunks | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes((Join-Path $PWD 'nightview-source.tar.gz'), [Convert]::FromBase64String($text))
          New-Item -ItemType Directory -Force buildsrc | Out-Null
          tar -xzf nightview-source.tar.gz -C buildsrc
      - name: Inspect toolbar fullscreen mouse flow
        shell: pwsh
        working-directory: buildsrc
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host '=== MAIN WINDOWS RELEVANT ==='
          Get-Content main_windows.go | Select-String -Pattern 'toolbar|button|CreateWindow|WM_MOUSEMOVE|WM_NCMOUSEMOVE|WM_TIMER|SetTimer|KillTimer|fullscreen|FullScreen|toggleFullscreen|enterFullscreen|exitFullscreen|ShowWindow|MoveWindow|SetWindowPos|clientHeight|toolbarHeight|topBar|controls' -CaseSensitive:$false -Context 18,40 | ForEach-Object {
            Write-Host ('--- line ' + $_.LineNumber + ' ---')
            $_.Context.PreContext | ForEach-Object { Write-Host $_ }
            Write-Host $_.Line
            $_.Context.PostContext | ForEach-Object { Write-Host $_ }
          }
          Write-Host '=== VIEWER APP STRUCT ==='
          Get-Content main_windows.go | Select-String -Pattern 'type viewerApp struct' -CaseSensitive:$false -Context 0,100 | ForEach-Object {
            Write-Host ('--- line ' + $_.LineNumber + ' ---')
            Write-Host $_.Line
            $_.Context.PostContext | ForEach-Object { Write-Host $_ }
          }
