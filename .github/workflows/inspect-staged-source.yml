name: Inspect staged NightView source

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/inspect-staged-source.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source
        shell: pwsh
        run: |
          $chunks = Get-ChildItem 'source/current/chunk_*.b64' | Sort-Object Name
          $text = ($chunks | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes((Join-Path $PWD 'nightview-source.tar.gz'), [Convert]::FromBase64String($text))
          New-Item -ItemType Directory -Force buildsrc | Out-Null
          tar -xzf nightview-source.tar.gz -C buildsrc
      - name: Print exact viewer ranges
        shell: pwsh
        working-directory: buildsrc
        run: |
          $lines = Get-Content main_windows.go
          Write-Host '=== MAIN 430-540 ==='
          for ($i=429; $i -lt [Math]::Min(540,$lines.Count); $i++) { Write-Host ("{0}: {1}" -f ($i+1),$lines[$i]) }
          Write-Host '=== MAIN 620-790 ==='
          for ($i=619; $i -lt [Math]::Min(790,$lines.Count); $i++) { Write-Host ("{0}: {1}" -f ($i+1),$lines[$i]) }
          Write-Host '=== MAIN 810-960 ==='
          for ($i=809; $i -lt [Math]::Min(960,$lines.Count); $i++) { Write-Host ("{0}: {1}" -f ($i+1),$lines[$i]) }
          Write-Host '=== MAIN 960-1130 ==='
          for ($i=959; $i -lt [Math]::Min(1130,$lines.Count); $i++) { Write-Host ("{0}: {1}" -f ($i+1),$lines[$i]) }
