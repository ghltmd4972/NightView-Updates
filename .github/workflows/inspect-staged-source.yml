name: Inspect NightView toolbar functions

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/inspect-staged-source.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $chunks = Get-ChildItem 'source/current/chunk_*.b64' | Sort-Object Name
          $text = ($chunks | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes((Join-Path $PWD 'nightview-source.tar.gz'), [Convert]::FromBase64String($text))
          New-Item -ItemType Directory -Force buildsrc | Out-Null
          tar -xzf nightview-source.tar.gz -C buildsrc
      - name: Print exact relevant functions
        shell: pwsh
        working-directory: buildsrc
        run: |
          $ErrorActionPreference = 'Stop'
          $lines = Get-Content main_windows.go

          function Print-Function([string]$namePattern) {
            $start = -1
            for ($i=0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match $namePattern) { $start = $i; break }
            }
            if ($start -lt 0) {
              Write-Host ("=== NOT FOUND: " + $namePattern + " ===")
              return
            }
            $end = $lines.Count - 1
            for ($j=$start+1; $j -lt $lines.Count; $j++) {
              if ($lines[$j] -match '^func ') { $end = $j - 1; break }
            }
            Write-Host ("=== " + $namePattern + " lines " + ($start+1) + "-" + ($end+1) + " ===")
            for ($k=$start; $k -le $end; $k++) {
              Write-Host ("{0:D4}: {1}" -f ($k+1), $lines[$k])
            }
          }

          $structStart = -1
          for ($i=0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^type viewerApp struct') { $structStart = $i; break }
          }
          if ($structStart -ge 0) {
            Write-Host ("=== viewerApp struct from line " + ($structStart+1) + " ===")
            for ($k=$structStart; $k -lt [Math]::Min($lines.Count,$structStart+90); $k++) {
              Write-Host ("{0:D4}: {1}" -f ($k+1), $lines[$k])
            }
          }

          Print-Function '^func wndProc'
          Print-Function '^func \(a \*viewerApp\) onMouseMove'
          Print-Function '^func \(a \*viewerApp\) onLeftDown'
          Print-Function '^func \(a \*viewerApp\) onLeftUp'
          Print-Function '^func \(a \*viewerApp\) paint'
          Print-Function '^func \(a \*viewerApp\) toggleFullscreen'
          Print-Function '^func \(a \*viewerApp\) pointInViewport'
          Print-Function '^func \(a \*viewerApp\) toolbar'
          Print-Function '^func \(a \*viewerApp\) viewport'
