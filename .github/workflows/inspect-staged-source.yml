name: Inspect staged NightView source

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/inspect-staged-source.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $chunks = Get-ChildItem 'source/current/chunk_*.b64' | Sort-Object Name
          $text = ($chunks | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes((Join-Path $PWD 'nightview-source.tar.gz'), [Convert]::FromBase64String($text))
          New-Item -ItemType Directory -Force buildsrc | Out-Null
          tar -xzf nightview-source.tar.gz -C buildsrc
      - name: Inspect startup and update code
        shell: pwsh
        working-directory: buildsrc
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host '=== GO FILES ==='
          Get-ChildItem -Recurse -Filter *.go | ForEach-Object { Write-Host $_.FullName.Replace((Get-Location).Path + '\\','') }

          Write-Host '=== STARTUP / WINDOW MATCHES ==='
          Get-ChildItem -Recurse -Filter *.go | Select-String -Pattern 'ShowWindow|SW_SHOW|SW_MAX|CreateWindow|SetWindowPos|WINDOWPLACEMENT|nCmdShow|showCmd|maximiz|fullscreen|full screen' -CaseSensitive:$false -Context 8,12 | ForEach-Object {
            Write-Host ('--- ' + $_.Path + ':' + $_.LineNumber + ' ---')
            $_.Context.PreContext | ForEach-Object { Write-Host $_ }
            Write-Host $_.Line
            $_.Context.PostContext | ForEach-Object { Write-Host $_ }
          }

          Write-Host '=== UPDATE MATCHES ==='
          Get-ChildItem -Recurse -Filter *.go | Select-String -Pattern 'update|updater|latest.json|CreateProcess|restart|rollback|backup|NightViewUpdater' -CaseSensitive:$false -Context 6,10 | ForEach-Object {
            Write-Host ('--- ' + $_.Path + ':' + $_.LineNumber + ' ---')
            $_.Context.PreContext | ForEach-Object { Write-Host $_ }
            Write-Host $_.Line
            $_.Context.PostContext | ForEach-Object { Write-Host $_ }
          }
