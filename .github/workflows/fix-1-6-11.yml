name: Fix NightView 1.6.11 startup reveal

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-1-6-11.yml
      - scripts/patch_1_6_11.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightview-1-6-11
  cancel-in-progress: true

jobs:
  patch-build-test-stage:
    runs-on: windows-latest
    env:
      GOFLAGS: -buildvcs=false
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          check-latest: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct and verify 1.6.10 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $chunks = Get-ChildItem 'source/current/chunk_*.b64' | Sort-Object Name
          if ($chunks.Count -lt 1) { throw 'No staged source chunks found.' }
          $text = ($chunks | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes((Join-Path $PWD 'nightview-source.tar.gz'), [Convert]::FromBase64String($text))
          $expected = ((Get-Content SOURCE_SHA256.txt -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash nightview-source.tar.gz -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Current source SHA-256 mismatch: $actual != $expected" }
          New-Item -ItemType Directory -Force buildsrc | Out-Null
          tar -xzf nightview-source.tar.gz -C buildsrc
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -ne '1.6.10') { throw "Expected source version 1.6.10, found $version" }

      - name: Apply startup reveal fix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts\patch_1_6_11.py buildsrc
          Push-Location buildsrc
          gofmt -w main_windows.go startup_reveal_windows_test.go
          Pop-Location

          $main = Get-Content buildsrc\main_windows.go -Raw
          foreach ($needle in @(
            'deferInitialReveal',
            'shouldDeferInitialReveal',
            'initialWindowStyle',
            'prepareDeferredInitialFullscreen',
            'showPreparedInitialWindow',
            'if !app.deferInitialReveal',
            'windowStyle := initialWindowStyle(app.deferInitialReveal)'
          )) {
            if (-not $main.Contains($needle)) { throw "Missing startup reveal behavior: $needle" }
          }
          if ($main.Contains('pCreateWindowEx.Call(0, uintptr(unsafe.Pointer(cls)), uintptr(unsafe.Pointer(title)), WS_OVERLAPPEDWINDOW|WS_VISIBLE')) {
            throw 'Old always-visible startup CreateWindow path is still present'
          }

      - name: Build and run full Windows regression suite
        shell: pwsh
        working-directory: buildsrc
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '1.6.11'

          go build -trimpath -ldflags="-s -w -buildid= -H=windowsgui -X main.version=$version" -o ..\NightView.exe .
          go build -trimpath -ldflags="-s -w -buildid= -H=windowsgui -X main.version=1.0.0" -o ..\NightViewUpdater.exe .\updater
          go build -trimpath -ldflags="-s -w -buildid= -H=windowsgui" -o ..\NightViewTestSuccess.exe .\updater\testfixture_success
          go build -trimpath -ldflags="-s -w -buildid= -H=windowsgui" -o ..\NightViewTestFailure.exe .\updater\testfixture_failure
          go build -trimpath -ldflags="-s -w -buildid= -H=windowsgui" -o ..\NightViewAITestEngine.exe .\ai\testfixture_engine

          $env:NIGHTVIEW_RELEASE_PE = (Resolve-Path ..\NightView.exe).Path
          $env:NIGHTVIEW_UPDATER_PE = (Resolve-Path ..\NightViewUpdater.exe).Path
          $env:NIGHTVIEW_TARGET_PE = $env:NIGHTVIEW_RELEASE_PE
          $env:NIGHTVIEW_UPDATER_BUILT = $env:NIGHTVIEW_UPDATER_PE
          $env:NIGHTVIEW_SUCCESS_PE = (Resolve-Path ..\NightViewTestSuccess.exe).Path
          $env:NIGHTVIEW_FAILURE_PE = (Resolve-Path ..\NightViewTestFailure.exe).Path
          $env:NIGHTVIEW_AI_FIXTURE = (Resolve-Path ..\NightViewAITestEngine.exe).Path

          go test -count=1 .\...
          go vet -unsafeptr=false .\...

      - name: Verify hidden-first-window behavior in built EXE
        shell: pwsh
        working-directory: buildsrc
        run: |
          $ErrorActionPreference = 'Stop'

          Add-Type -AssemblyName System.Drawing
          $imgPath = Join-Path $PWD 'startup-large-test.png'
          $bmp = New-Object System.Drawing.Bitmap 7000,7000
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.Clear([System.Drawing.Color]::FromArgb(25, 35, 45))
          $bmp.Save($imgPath, [System.Drawing.Imaging.ImageFormat]::Png)
          $g.Dispose()
          $bmp.Dispose()

          $cs = @'
          using System;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          public static class NVWindowProbe {
              public delegate bool EnumWindowsProc(IntPtr hWnd, IntPtr lParam);
              [DllImport("user32.dll")] public static extern bool EnumWindows(EnumWindowsProc lpEnumFunc, IntPtr lParam);
              [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr hWnd, out uint processId);
              [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr hWnd);
              public static IntPtr FindForPid(uint pid) {
                  IntPtr found = IntPtr.Zero;
                  EnumWindows((h, l) => {
                      uint p;
                      GetWindowThreadProcessId(h, out p);
                      if (p == pid) { found = h; return false; }
                      return true;
                  }, IntPtr.Zero);
                  return found;
              }
          }
          '@
          Add-Type -TypeDefinition $cs

          $p = Start-Process -FilePath (Resolve-Path '..\NightView.exe') -ArgumentList ('"' + $imgPath + '"') -PassThru
          try {
              $firstWindow = [IntPtr]::Zero
              $firstVisible = $null
              $deadline = [DateTime]::UtcNow.AddSeconds(8)
              while([DateTime]::UtcNow -lt $deadline -and $firstWindow -eq [IntPtr]::Zero) {
                  $firstWindow = [NVWindowProbe]::FindForPid([uint32]$p.Id)
                  if ($firstWindow -ne [IntPtr]::Zero) {
                      $firstVisible = [NVWindowProbe]::IsWindowVisible($firstWindow)
                      break
                  }
                  Start-Sleep -Milliseconds 5
              }
              if ($firstWindow -eq [IntPtr]::Zero) {
                  throw 'NightView never created its startup window'
              }
              if ($firstVisible) {
                  throw 'NightView startup window was visible before the selected image was ready'
              }

              $becameVisible = $false
              $deadline = [DateTime]::UtcNow.AddSeconds(15)
              while([DateTime]::UtcNow -lt $deadline) {
                  $w = [NVWindowProbe]::FindForPid([uint32]$p.Id)
                  if ($w -ne [IntPtr]::Zero -and [NVWindowProbe]::IsWindowVisible($w)) {
                      $becameVisible = $true
                      break
                  }
                  if ($p.HasExited) { break }
                  Start-Sleep -Milliseconds 20
              }
              if (-not $becameVisible) {
                  throw 'NightView did not reveal the window after the selected image was ready'
              }
              Write-Host 'Verified: first created window was hidden, then became visible after image loading.'
          }
          finally {
              if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
              Remove-Item $imgPath -Force -ErrorAction SilentlyContinue
          }

      - name: Repack verified 1.6.11 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location buildsrc
          tar -czf ..\nightview-source-1.6.11.tar.gz *
          Pop-Location

          $hash = (Get-FileHash 'nightview-source-1.6.11.tar.gz' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  nightview-source.tar.gz" | Set-Content 'SOURCE_SHA256.txt' -Encoding ascii
          "$hash  nightview-source.tar.gz" | Set-Content 'STAGED_SOURCE_SHA256_1_6_11.txt' -Encoding ascii
          "1.6.11" | Set-Content 'VERSION' -Encoding ascii

          $notes = @(
            'NightView 1.6.11',
            '- 탐색기/Bandizip 등에서 이미지 파일을 지정해 실행할 때 1280x800 빈 NightView 창이 먼저 노출되던 문제 수정',
            '- 이미지 파일 시작은 숨김 창으로 생성하고 첫 이미지 디코딩 완료 전까지 화면에 표시하지 않음',
            '- 첫 이미지가 준비되면 숨김 상태에서 전체화면 크기와 맞춤 배치를 먼저 완료한 뒤 한 번에 표시',
            '- 이미지 실행 시 창모드 -> 전체화면으로 전환되는 중간 화면 제거',
            '- NightView.exe를 이미지 없이 단독 실행하는 경우 기존 빈 시작 화면 동작은 유지',
            '- 이미지 로드 실패 시에는 오류 확인이 가능하도록 NightView 창을 표시한 뒤 오류 메시지 출력',
            '- 기존 전체화면 툴바, 탐색기 실제 순서 정렬, WEBP/파일 형식, 파일 연결, AI 4K 저장/비교, 업데이트/롤백 기능 유지'
          ) -join [Environment]::NewLine
          [IO.File]::WriteAllText((Join-Path $PWD 'RELEASE_NOTES.txt'), $notes + [Environment]::NewLine, (New-Object Text.UTF8Encoding($false)))

          $bytes = [IO.File]::ReadAllBytes((Join-Path $PWD 'nightview-source-1.6.11.tar.gz'))
          $b64 = [Convert]::ToBase64String($bytes)
          Get-ChildItem 'source/current/chunk_*.b64' -ErrorAction SilentlyContinue | Remove-Item -Force
          $chunkSize = 8000
          $index = 0
          for ($offset = 0; $offset -lt $b64.Length; $offset += $chunkSize) {
            $length = [Math]::Min($chunkSize, $b64.Length - $offset)
            $part = $b64.Substring($offset, $length)
            $name = ('source/current/chunk_{0:D4}.b64' -f $index)
            [IO.File]::WriteAllText((Join-Path $PWD $name), $part, (New-Object Text.UTF8Encoding($false)))
            $index++
          }
          Write-Host "Staged 1.6.11 source SHA-256: $hash"
          Write-Host "Wrote $index source chunks."

      - name: Commit verified 1.6.11 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/current SOURCE_SHA256.txt STAGED_SOURCE_SHA256_1_6_11.txt VERSION RELEASE_NOTES.txt
          if (git diff --cached --quiet) { throw 'No verified changes were produced.' }
          git commit -m 'Release NightView 1.6.11 deferred first-image reveal'
          git push
