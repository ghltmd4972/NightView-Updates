name: Fix window controls and AI 4K comparison

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-window-controls-compare.yml
      - scripts/patch_1_6_6.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightview-1-6-6-fix
  cancel-in-progress: true

jobs:
  patch-build-test-stage:
    runs-on: windows-latest
    env:
      GOFLAGS: -buildvcs=false
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          check-latest: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct and verify 1.6.5 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $chunks = Get-ChildItem 'source/current/chunk_*.b64' | Sort-Object Name
          if ($chunks.Count -lt 1) { throw 'No staged source chunks found.' }
          $text = ($chunks | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes((Join-Path $PWD 'nightview-source.tar.gz'), [Convert]::FromBase64String($text))
          $expected = ((Get-Content SOURCE_SHA256.txt -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash nightview-source.tar.gz -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Current source SHA-256 mismatch: $actual != $expected" }
          New-Item -ItemType Directory -Force buildsrc | Out-Null
          tar -xzf nightview-source.tar.gz -C buildsrc
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -ne '1.6.5') { throw "Expected source version 1.6.5, found $version" }

      - name: Apply 1.6.6 fixes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts\patch_1_6_6.py buildsrc
          Push-Location buildsrc
          gofmt -w main_windows.go comparison_windows.go ai_windows.go window_controls_windows_test.go comparison_snapshot_windows_test.go
          Pop-Location

          $main = Get-Content buildsrc\main_windows.go -Raw
          $comparison = Get-Content buildsrc\comparison_windows.go -Raw
          $ai = Get-Content buildsrc\ai_windows.go -Raw

          foreach ($needle in @('btnMinimize','btnRestore','btnClose','fullscreenWindowButtonLayout','SW_MINIMIZE')) {
            if (-not $main.Contains($needle)) { throw "Missing window-control fix: $needle" }
          }
          foreach ($needle in @('stageAICompareOriginalSnapshot','setAICompareCandidateWithCleanup','clearAICompareCandidate','cleanupPath')) {
            if (-not $comparison.Contains($needle)) { throw "Missing comparison snapshot fix: $needle" }
          }
          foreach ($needle in @('snapshotPath, snapshotCleanup','C 키로 덮어쓰기 전 원본과 AI 4K 결과를 비교할 수 있습니다.')) {
            if (-not $ai.Contains($needle)) { throw "Missing AI 4K overwrite fix: $needle" }
          }

      - name: Build and run full regression suite
        shell: pwsh
        working-directory: buildsrc
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '1.6.6'

          go build -trimpath -ldflags="-s -w -buildid= -H=windowsgui -X main.version=$version" -o ..\NightView.exe .
          go build -trimpath -ldflags="-s -w -buildid= -H=windowsgui -X main.version=1.0.0" -o ..\NightViewUpdater.exe .\updater
          go build -trimpath -ldflags="-s -w -buildid= -H=windowsgui" -o ..\NightViewTestSuccess.exe .\updater\testfixture_success
          go build -trimpath -ldflags="-s -w -buildid= -H=windowsgui" -o ..\NightViewTestFailure.exe .\updater\testfixture_failure
          go build -trimpath -ldflags="-s -w -buildid= -H=windowsgui" -o ..\NightViewAITestEngine.exe .\ai\testfixture_engine

          $env:NIGHTVIEW_RELEASE_PE = (Resolve-Path ..\NightView.exe).Path
          $env:NIGHTVIEW_UPDATER_PE = (Resolve-Path ..\NightViewUpdater.exe).Path
          $env:NIGHTVIEW_TARGET_PE = $env:NIGHTVIEW_RELEASE_PE
          $env:NIGHTVIEW_UPDATER_BUILT = $env:NIGHTVIEW_UPDATER_PE
          $env:NIGHTVIEW_SUCCESS_PE = (Resolve-Path ..\NightViewTestSuccess.exe).Path
          $env:NIGHTVIEW_FAILURE_PE = (Resolve-Path ..\NightViewTestFailure.exe).Path
          $env:NIGHTVIEW_AI_FIXTURE = (Resolve-Path ..\NightViewAITestEngine.exe).Path

          go test -count=1 .\...
          go vet -unsafeptr=false .\...

      - name: Repack verified 1.6.6 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location buildsrc
          tar -czf ..\nightview-source-1.6.6.tar.gz *
          Pop-Location

          $hash = (Get-FileHash 'nightview-source-1.6.6.tar.gz' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  nightview-source.tar.gz" | Set-Content 'SOURCE_SHA256.txt' -Encoding ascii
          "$hash  nightview-source.tar.gz" | Set-Content 'STAGED_SOURCE_SHA256_1_6_6.txt' -Encoding ascii
          "1.6.6" | Set-Content 'VERSION' -Encoding ascii

          $notes = @(
            'NightView 1.6.6',
            '- 전체화면 상단 자동 툴바 오른쪽에 최소화 / 복원 / 닫기 버튼 추가',
            '- 닫기 버튼은 마우스를 올리면 빨간색으로 표시',
            '- 복원 버튼으로 전체화면에서 일반 창으로 즉시 복귀',
            '- AI 4K 결과를 원본에 덮어써도 덮어쓰기 전 원본을 비교 전용 임시 스냅샷으로 보존',
            '- AI 4K 원본 덮어쓰기 후에도 C 키로 원본과 4K 결과 비교 가능',
            '- 비교용 임시 원본은 새 비교 대상이 생기거나 NightView 종료 시 자동 정리',
            '- 다른 이름으로 저장한 AI 결과의 기존 원본 비교 기능 유지',
            '- NightView 1.6.5 상단 자동 툴바 및 기존 업데이트/롤백 기능 유지'
          ) -join [Environment]::NewLine
          [IO.File]::WriteAllText((Join-Path $PWD 'RELEASE_NOTES.txt'), $notes + [Environment]::NewLine, (New-Object Text.UTF8Encoding($false)))

          $bytes = [IO.File]::ReadAllBytes((Join-Path $PWD 'nightview-source-1.6.6.tar.gz'))
          $b64 = [Convert]::ToBase64String($bytes)
          Get-ChildItem 'source/current/chunk_*.b64' -ErrorAction SilentlyContinue | Remove-Item -Force
          $chunkSize = 8000
          $index = 0
          for ($offset = 0; $offset -lt $b64.Length; $offset += $chunkSize) {
            $length = [Math]::Min($chunkSize, $b64.Length - $offset)
            $part = $b64.Substring($offset, $length)
            $name = ('source/current/chunk_{0:D4}.b64' -f $index)
            [IO.File]::WriteAllText((Join-Path $PWD $name), $part, (New-Object Text.UTF8Encoding($false)))
            $index++
          }
          Write-Host "Staged 1.6.6 source SHA-256: $hash"
          Write-Host "Wrote $index source chunks."

      - name: Commit verified 1.6.6 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/current SOURCE_SHA256.txt STAGED_SOURCE_SHA256_1_6_6.txt VERSION RELEASE_NOTES.txt
          if (git diff --cached --quiet) { throw 'No verified changes were produced.' }
          git commit -m 'Release NightView 1.6.6 window controls and AI comparison fixes'
          git push
