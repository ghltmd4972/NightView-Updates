          type aiCompareCandidate struct {
          \toriginalPath string
          \tresultPath   string
          \toriginalSHA  string
          \tscale        int
          }

          type aiCompareState struct {
          \tcandidate aiCompareCandidate
          \tactive    bool
          \toriginal  *imageAsset
          \tsplit     float64
          \tdragging  bool
          }

          var aiCompare aiCompareState

          func sameWindowsPath(a, b string) bool {
          \tif a == "" || b == "" { return false }
          \treturn strings.EqualFold(filepath.Clean(a), filepath.Clean(b))
          }

          func (a *viewerApp) setAICompareCandidate(original, result string, scale int, originalSHA string) {
          \tif scale != 2 && scale != 4 { return }
          \taiCompare.candidate = aiCompareCandidate{
          \t\toriginalPath: filepath.Clean(original),
          \t\tresultPath: filepath.Clean(result),
          \t\toriginalSHA: strings.ToLower(strings.TrimSpace(originalSHA)),
          \t\tscale: scale,
          \t}
          }

          func (a *viewerApp) aiComparisonActive() bool { return aiCompare.active }
          func (a *viewerApp) aiComparisonSplit() float64 {
          \tif !aiCompare.active { return 0 }
          \treturn aiCompare.split
          }

          func (a *viewerApp) canStartAIComparison() bool {
          \tif aiCompare.active { return true }
          \tc := aiCompare.candidate
          \tif a.image == nil || a.loading || c.originalPath == "" || c.resultPath == "" { return false }
          \tif !sameWindowsPath(a.currentPath, c.resultPath) { return false }
          \tif c.scale != 2 && c.scale != 4 { return false }
          \tif len(c.originalSHA) != 64 { return false }
          \tif st, err := os.Stat(c.originalPath); err != nil || !st.Mode().IsRegular() { return false }
          \treturn true
          }

          func (a *viewerApp) toggleAIComparison() {
          \tif aiCompare.active {
          \t\ta.endAIComparison()
          \t\treturn
          \t}
          \tif err := a.startAIComparison(); err != nil {
          \t\tmessageBox(a.hwnd, "원본과 AI 결과를 비교할 수 없습니다.\n\n"+err.Error(), "NightView AI 비교", MB_OK|MB_ICONERROR)
          \t}
          }

          func (a *viewerApp) startAIComparison() error {
          \tif !a.canStartAIComparison() {
          \t\treturn errors.New("현재 이미지에 연결된 AI 원본 정보가 없습니다")
          \t}
          \tc := aiCompare.candidate
          \thash, _, err := fileSHA256(c.originalPath)
          \tif err != nil { return fmt.Errorf("원본 파일 확인 실패: %w", err) }
          \tif !strings.EqualFold(hash, c.originalSHA) {
          \t\treturn errors.New("AI 처리 후 원본 파일 내용이 변경되었습니다")
          \t}
          \toriginal, err := loadImageAsset(c.originalPath)
          \tif err != nil { return fmt.Errorf("원본 이미지 열기 실패: %w", err) }
          \tif a.image == nil || !compareDimensionsValid(original.width, original.height, a.image.width, a.image.height, c.scale) {
          \t\toriginal.dispose()
          \t\treturn errors.New("원본과 AI 결과의 해상도 관계가 올바르지 않습니다")
          \t}
          \taiCompare.original = original
          \taiCompare.active = true
          \taiCompare.split = 0.5
          \taiCompare.dragging = false
          \ta.invalidate()
          \treturn nil
          }

          func (a *viewerApp) endAIComparison() {
          \tif aiCompare.dragging {
          \t\tpReleaseCapture.Call()
          \t}
          \taiCompare.dragging = false
          \taiCompare.active = false
          \tif aiCompare.original != nil {
          \t\taiCompare.original.dispose()
          \t\taiCompare.original = nil
          \t}
          \ta.invalidate()
          }

          func drawGDIImageClipped(dc uintptr, clip RECT, asset *imageAsset, dx, dy, dw, dh int32) bool {
          \tif asset == nil || asset.handle == 0 || clip.Right <= clip.Left || clip.Bottom <= clip.Top { return false }
          \tsaved, _, _ := pSaveDC.Call(dc)
          \tif saved == 0 { return false }
          \tdefer pRestoreDC.Call(dc, saved)
          \tpIntersectClipRect.Call(dc, uptr32(clip.Left), uptr32(clip.Top), uptr32(clip.Right), uptr32(clip.Bottom))
          \tvar g uintptr
          \tif st, _, _ := pGdipCreateFromHDC.Call(dc, uintptr(unsafe.Pointer(&g))); st != 0 || g == 0 { return false }
          \tdefer pGdipDeleteGraphics.Call(g)
          \tpGdipSetInterpolationMode.Call(g, InterpolationModeHighQualityBicubic)
          \tpGdipSetPixelOffsetMode.Call(g, PixelOffsetModeHighQuality)
          \tst, _, _ := pGdipDrawImageRectI.Call(g, asset.handle, uptr32(dx), uptr32(dy), uintptr(dw), uintptr(dh))
          \treturn st == 0
          }

          func drawComparisonImages(dc uintptr, vr RECT, original, result *imageAsset, dx, dy, dw, dh, splitX int32) bool {
          \tif original == nil || result == nil || splitX <= vr.Left || splitX >= vr.Right { return false }
          \tif !drawGDIImageClipped(dc, vr, result, dx, dy, dw, dh) { return false }
          \tleft := vr
          \tleft.Right = splitX
          \treturn drawGDIImageClipped(dc, left, original, dx, dy, dw, dh)
          }

          func (a *viewerApp) drawAIComparison(dc uintptr, vr RECT) bool {
          \tif !aiCompare.active || aiCompare.original == nil || a.image == nil { return false }
          \tif !sameWindowsPath(a.currentPath, aiCompare.candidate.resultPath) {
          \t\ta.endAIComparison()
          \t\treturn false
          \t}
          \tdx := int32(math.Round(a.offsetX))
          \tdy := vr.Top + int32(math.Round(a.offsetY))
          \tdw := int32(math.Max(1, math.Round(float64(a.image.width)*a.scale)))
          \tdh := int32(math.Max(1, math.Round(float64(a.image.height)*a.scale)))
          \tsplitX := compareSplitX(vr.Left, vr.Right, aiCompare.split)
          \tif !drawComparisonImages(dc, vr, aiCompare.original, a.image, dx, dy, dw, dh, splitX) { return false }
          \tdrawLine(dc, splitX, vr.Top, splitX, vr.Bottom, rgb(235, 235, 235))
          \tlabelH := a.dip(28)
          \tleftLabel := RECT{vr.Left + a.dip(10), vr.Top + a.dip(8), splitX - a.dip(8), vr.Top + a.dip(8) + labelH}
          \trightLabel := RECT{splitX + a.dip(8), vr.Top + a.dip(8), vr.Right - a.dip(10), vr.Top + a.dip(8) + labelH}
          \tdrawText(dc, "원본", leftLabel, a.fontSmall, rgb(245,245,245), DT_VCENTER|DT_SINGLELINE)
          \tdrawText(dc, "AI", rightLabel, a.fontSmall, rgb(245,245,245), DT_RIGHT|DT_VCENTER|DT_SINGLELINE)
          \treturn true
          }

          func (a *viewerApp) compareDividerNear(p POINT) bool {
          \tif !aiCompare.active || !a.pointInViewport(p) { return false }
          \tvr := a.viewportRect()
          \tx := compareSplitX(vr.Left, vr.Right, aiCompare.split)
          \td := p.X - x
          \tif d < 0 { d = -d }
          \treturn d <= a.dip(8)
          }

          func (a *viewerApp) setCompareCursor() {
          \tc, _, _ := pLoadCursor.Call(0, IDC_SIZEWE)
          \tpSetCursor.Call(c)
          }

          func (a *viewerApp) onAICompareLeftDown(p POINT) bool {
          \tif !a.compareDividerNear(p) { return false }
          \taiCompare.dragging = true
          \tpSetCapture.Call(a.hwnd)
          \ta.setCompareCursor()
          \treturn true
          }

          func (a *viewerApp) onAICompareLeftUp(_ POINT) bool {
          \tif !aiCompare.dragging { return false }
          \taiCompare.dragging = false
          \tpReleaseCapture.Call()
          \ta.setCompareCursor()
          \treturn true
          }

          func (a *viewerApp) onAICompareMouseMove(p POINT) bool {
          \tif !aiCompare.active { return false }
          \tvr := a.viewportRect()
          \tif aiCompare.dragging {
          \t\tw := vr.Right - vr.Left
          \t\tif w > 0 {
          \t\t\taiCompare.split = clampCompareSplit(float64(p.X-vr.Left) / float64(w))
          \t\t\ta.invalidate()
          \t\t}
          \t\ta.setCompareCursor()
          \t\treturn true
          \t}
          \tif a.compareDividerNear(p) {
          \t\ta.setCompareCursor()
          \t\treturn true
          \t}
          \treturn false
          }

          var _ = syscall.Errno(0)
