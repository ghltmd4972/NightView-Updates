          func storeAICache(localData, input, sourceSHA string, scale int, m aiEngineManifest, output string) error {
          \tdst, err := aiCachePath(localData, input, sourceSHA, scale, m)
          \tif err != nil {
          \t\treturn err
          \t}
          \tif err := os.MkdirAll(filepath.Dir(dst), 0o755); err != nil {
          \t\treturn err
          \t}
