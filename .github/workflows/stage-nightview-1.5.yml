name: Stage NightView 1.5 comparison and cache

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/stage-nightview-1.5.yml

permissions:
  contents: write

concurrency:
  group: nightview-stage-1-5
  cancel-in-progress: true

jobs:
  stage:
    runs-on: windows-latest
    env:
      GOFLAGS: -buildvcs=false
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          check-latest: false

      - name: Reconstruct current 1.4 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $chunks = Get-ChildItem 'source/current/chunk_*.b64' | Sort-Object Name
          $text = ($chunks | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes((Join-Path $PWD 'nightview-source.tar.gz'), [Convert]::FromBase64String($text))
          $hash = (Get-FileHash nightview-source.tar.gz -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '94f3eef2e00a514d65df846b1b0937bea8c119c2b53611b3e8f753092ba054c3') {
            throw "Unexpected base source SHA-256: $hash"
          }
          New-Item -ItemType Directory -Force buildsrc | Out-Null
          tar -xzf nightview-source.tar.gz -C buildsrc

      - name: Apply comparison and AI cache implementation
        shell: pwsh
        working-directory: buildsrc
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if s.count(old) != 1:
                  raise SystemExit(f'{path}: expected one patch target, found {s.count(old)}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          replace_once('main_windows.go',
          '''\t\tcancelAIUpscale()
          \t\tr, _, _ := pDefWindowProc.Call(hwnd, uintptr(msg), wParam, lParam)''',
          '''\t\tcancelAIUpscale()
          \t\tapp.endAIComparison()
          \t\tr, _, _ := pDefWindowProc.Call(hwnd, uintptr(msg), wParam, lParam)''')

          old_paint = '''\tif a.image != nil {
          \t\tsaved, _, _ := pSaveDC.Call(dc)
          \t\tpIntersectClipRect.Call(dc, uptr32(vr.Left), uptr32(vr.Top), uptr32(vr.Right), uptr32(vr.Bottom))
          \t\tvar g uintptr
          \t\tif st, _, _ := pGdipCreateFromHDC.Call(dc, uintptr(unsafe.Pointer(&g))); st == 0 && g != 0 {
          \t\t\tpGdipSetInterpolationMode.Call(g, InterpolationModeHighQualityBicubic)
          \t\t\tpGdipSetPixelOffsetMode.Call(g, PixelOffsetModeHighQuality)
          \t\t\tdx := int32(math.Round(a.offsetX))
          \t\t\tdy := vr.Top + int32(math.Round(a.offsetY))
          \t\t\tdw := int32(math.Max(1, math.Round(float64(a.image.width)*a.scale)))
          \t\t\tdh := int32(math.Max(1, math.Round(float64(a.image.height)*a.scale)))
          \t\t\tpGdipDrawImageRectI.Call(g, a.image.handle, uptr32(dx), uptr32(dy), uintptr(dw), uintptr(dh))
          \t\t\tpGdipDeleteGraphics.Call(g)
          \t\t}
          \t\tif saved != 0 {
          \t\t\tpRestoreDC.Call(dc, saved)
          \t\t}
          \t} else if !a.loading {'''
          new_paint = '''\tif a.image != nil {
          \t\tif !a.drawAIComparison(dc, vr) {
          \t\t\tsaved, _, _ := pSaveDC.Call(dc)
          \t\t\tpIntersectClipRect.Call(dc, uptr32(vr.Left), uptr32(vr.Top), uptr32(vr.Right), uptr32(vr.Bottom))
          \t\t\tvar g uintptr
          \t\t\tif st, _, _ := pGdipCreateFromHDC.Call(dc, uintptr(unsafe.Pointer(&g))); st == 0 && g != 0 {
          \t\t\t\tpGdipSetInterpolationMode.Call(g, InterpolationModeHighQualityBicubic)
          \t\t\t\tpGdipSetPixelOffsetMode.Call(g, PixelOffsetModeHighQuality)
          \t\t\t\tdx := int32(math.Round(a.offsetX))
          \t\t\t\tdy := vr.Top + int32(math.Round(a.offsetY))
          \t\t\t\tdw := int32(math.Max(1, math.Round(float64(a.image.width)*a.scale)))
          \t\t\t\tdh := int32(math.Max(1, math.Round(float64(a.image.height)*a.scale)))
          \t\t\t\tpGdipDrawImageRectI.Call(g, a.image.handle, uptr32(dx), uptr32(dy), uintptr(dw), uintptr(dh))
          \t\t\t\tpGdipDeleteGraphics.Call(g)
          \t\t\t}
          \t\t\tif saved != 0 {
          \t\t\t\tpRestoreDC.Call(dc, saved)
          \t\t\t}
          \t\t}
          \t} else if !a.loading {'''
          replace_once('main_windows.go', old_paint, new_paint)

          replace_once('main_windows.go',
          '''\t\tif a.image.frameCount > 1 {
          \t\t\trt += fmt.Sprintf("    GIF %d/%d", a.image.frameIndex+1, a.image.frameCount)
          \t\t}
          \t}''',
          '''\t\tif a.image.frameCount > 1 {
          \t\t\trt += fmt.Sprintf("    GIF %d/%d", a.image.frameIndex+1, a.image.frameCount)
          \t\t}
          \t\tif a.aiComparisonActive() {
          \t\t\trt += fmt.Sprintf("    비교 %.0f%%", a.aiComparisonSplit()*100)
          \t\t}
          \t}''')

          replace_once('main_windows.go',
          '''\tif a.image == nil || !a.pointInViewport(p) {
          \t\treturn
          \t}
          \ta.panning = true''',
          '''\tif a.image == nil || !a.pointInViewport(p) {
          \t\treturn
          \t}
          \tif a.onAICompareLeftDown(p) {
          \t\treturn
          \t}
          \ta.panning = true''')

          replace_once('main_windows.go',
          '''func (a *viewerApp) onLeftUp(_ POINT) {
          \tif !a.panning {''',
          '''func (a *viewerApp) onLeftUp(p POINT) {
          \tif a.onAICompareLeftUp(p) {
          \t\treturn
          \t}
          \tif !a.panning {''')

          replace_once('main_windows.go',
          '''func (a *viewerApp) onMouseMove(p POINT) {
          \tif a.panning {''',
          '''func (a *viewerApp) onMouseMove(p POINT) {
          \tif a.onAICompareMouseMove(p) {
          \t\treturn
          \t}
          \tif a.panning {''')

          replace_once('main_windows.go',
          '''\t\treturn
          \t}
          \tswitch vk {''',
          '''\t\treturn
          \t}
          \tif vk == 'C' {
          \t\ta.toggleAIComparison()
          \t\treturn
          \t}
          \tswitch vk {''')

          replace_once('main_windows.go',
          '''\tcase VK_ESCAPE:
          \t\tif a.fullscreen {''',
          '''\tcase VK_ESCAPE:
          \t\tif a.aiComparisonActive() {
          \t\t\ta.endAIComparison()
          \t\t\treturn
          \t\t}
          \t\tif a.fullscreen {''')

          replace_once('main_windows.go',
          '''\t\tappendMenu(aiMenu, aiFlags, cmdAIUpscale2X, "2×  애니/일러스트")
          \t\tappendMenu(aiMenu, aiFlags, cmdAIUpscale4X, "4×  애니/일러스트")
          \t\tlabel := mustUTF16("AI 업스케일")''',
          '''\t\tappendMenu(aiMenu, aiFlags, cmdAIUpscale2X, "2×  애니/일러스트")
          \t\tappendMenu(aiMenu, aiFlags, cmdAIUpscale4X, "4×  애니/일러스트")
          \t\tpAppendMenu.Call(aiMenu, MF_SEPARATOR, 0, 0)
          \t\tcompareFlags := uintptr(MF_STRING)
          \t\tif a.aiComparisonActive() {
          \t\t\tcompareFlags |= MF_CHECKED
          \t\t} else if !a.canStartAIComparison() {
          \t\t\tcompareFlags |= MF_GRAYED
          \t\t}
          \t\tappendMenu(aiMenu, compareFlags, cmdAICompare, "원본 ↔ AI 결과 비교    C")
          \t\tlabel := mustUTF16("AI 업스케일")''')

          replace_once('main_windows.go',
          '''\tcase cmdAIUpscale4X:
          \t\ta.startAIUpscale(4)
          \tcase cmdWheelNav:''',
          '''\tcase cmdAIUpscale4X:
          \t\ta.startAIUpscale(4)
          \tcase cmdAICompare:
          \t\ta.toggleAIComparison()
          \tcase cmdWheelNav:''')

          replace_once('main_windows.go',
          '''func (a *viewerApp) loadPath(path string) {
          \ta.generation++''',
          '''func (a *viewerApp) loadPath(path string) {
          \tif a.aiComparisonActive() {
          \t\ta.endAIComparison()
          \t}
          \ta.generation++''')

          p = Path('ai_windows.go')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
          '''\tresultPath string
          \terrText    string
          \tcancel     context.CancelFunc''',
          '''\tresultPath string
          \tinputSHA   string
          \tcacheHit   bool
          \terrText    string
          \tcancel     context.CancelFunc''', 1)

          s = s.replace(
          '''\taiUpscales.resultPath = ""
          \taiUpscales.errText = ""''',
          '''\taiUpscales.resultPath = ""
          \taiUpscales.inputSHA = ""
          \taiUpscales.cacheHit = false
          \taiUpscales.errText = ""''', 1)

          start = s.index('func (a *viewerApp) runAIUpscaleJob(')
          end = s.index('\nfunc runAIEngineProcess(', start)
          new_run = r'''func (a *viewerApp) runAIUpscaleJob(ctx context.Context, input string, scale int) {
          \tclient := newUpdateHTTPClient()
          \tm, err := fetchAIEngineManifest(ctx, client, aiManifestURL)
          \tif err != nil {
          \t\ta.finishAIUpscale("", "", false, fmt.Errorf("AI 엔진 정보를 확인하지 못했습니다: %w", err))
          \t\treturn
          \t}
          \tlocalData, err := nightViewLocalDataDir()
          \tif err != nil {
          \t\ta.finishAIUpscale("", "", false, fmt.Errorf("NightView 로컬 데이터 폴더를 찾지 못했습니다: %w", err))
          \t\treturn
          \t}
          \tsourceSHA, _, err := fileSHA256(input)
          \tif err != nil {
          \t\ta.finishAIUpscale("", "", false, fmt.Errorf("원본 이미지 무결성 확인 실패: %w", err))
          \t\treturn
          \t}

          \tif cached, ok := findValidAICache(localData, input, sourceSHA, scale, m); ok {
          \t\tfinalPath, copyErr := commitAICachedOutput(cached, input, scale)
          \t\tif copyErr == nil {
          \t\t\ta.finishAIUpscale(finalPath, sourceSHA, true, nil)
          \t\t\treturn
          \t\t}
          \t}

          \tinst, err := ensureAIEngine(ctx, client, localData, m, validateAMD64PEExecutable)
          \tif err != nil {
          \t\ta.finishAIUpscale("", sourceSHA, false, fmt.Errorf("AI 엔진 준비 실패: %w", err))
          \t\treturn
          \t}

          \ttmpFile, err := os.CreateTemp(filepath.Dir(input), ".nightview-ai-*.png")
          \tif err != nil {
          \t\ta.finishAIUpscale("", sourceSHA, false, fmt.Errorf("결과 파일을 만들 수 없습니다: %w", err))
          \t\treturn
          \t}
          \ttmpOutput := tmpFile.Name()
          \tif err := tmpFile.Close(); err != nil {
          \t\t_ = os.Remove(tmpOutput)
          \t\ta.finishAIUpscale("", sourceSHA, false, fmt.Errorf("임시 결과 파일을 준비하지 못했습니다: %w", err))
          \t\treturn
          \t}
          \tif err := os.Remove(tmpOutput); err != nil && !errors.Is(err, os.ErrNotExist) {
          \t\ta.finishAIUpscale("", sourceSHA, false, fmt.Errorf("임시 결과 파일을 준비하지 못했습니다: %w", err))
          \t\treturn
          \t}
          \tdefer os.Remove(tmpOutput)

          \targs, err := buildAIEngineArgs(inst, input, tmpOutput, scale)
          \tif err != nil {
          \t\ta.finishAIUpscale("", sourceSHA, false, err)
          \t\treturn
          \t}
          \tif err := runAIEngineProcess(ctx, inst, args); err != nil {
          \t\ta.finishAIUpscale("", sourceSHA, false, err)
          \t\treturn
          \t}
          \tif err := validateAIUpscaleOutput(tmpOutput); err != nil {
          \t\ta.finishAIUpscale("", sourceSHA, false, fmt.Errorf("AI 결과 검증 실패: %w", err))
          \t\treturn
          \t}
          \tif err := validateAIUpscaleDimensions(input, tmpOutput, scale); err != nil {
          \t\ta.finishAIUpscale("", sourceSHA, false, fmt.Errorf("AI 결과 해상도 검증 실패: %w", err))
          \t\treturn
          \t}
          \tafterSHA, _, err := fileSHA256(input)
          \tif err != nil || afterSHA != sourceSHA {
          \t\ta.finishAIUpscale("", sourceSHA, false, errors.New("AI 처리 중 원본 이미지가 변경되어 결과 저장을 중단했습니다"))
          \t\treturn
          \t}
          \t_ = storeAICache(localData, input, sourceSHA, scale, m, tmpOutput)
          \tcleanupAICache(localData)

          \tfinalPath, err := commitAIOutput(tmpOutput, input, scale)
          \tif err != nil {
          \t\ta.finishAIUpscale("", sourceSHA, false, fmt.Errorf("AI 결과 저장 실패: %w", err))
          \t\treturn
          \t}
          \ta.finishAIUpscale(finalPath, sourceSHA, false, nil)
          }'''
          s = s[:start] + new_run + s[end:]

          old_finish_start = s.index('func (a *viewerApp) finishAIUpscale(')
          old_finish_end = s.index('\nfunc (a *viewerApp) onAIUpscaleDone()', old_finish_start)
          new_finish = r'''func (a *viewerApp) finishAIUpscale(result, inputSHA string, cacheHit bool, err error) {
          \taiUpscales.mu.Lock()
          \taiUpscales.working = false
          \taiUpscales.cancel = nil
          \taiUpscales.inputSHA = inputSHA
          \taiUpscales.cacheHit = cacheHit
          \tif err != nil {
          \t\taiUpscales.errText = err.Error()
          \t\taiUpscales.resultPath = ""
          \t} else {
          \t\taiUpscales.errText = ""
          \t\taiUpscales.resultPath = result
          \t}
          \taiUpscales.mu.Unlock()
          \tif a.closing.Load() {
          \t\treturn
          \t}
          \tif err != nil {
          \t\tpPostMessage.Call(a.hwnd, WM_AI_UPSCALE_ERROR, 0, 0)
          \t} else {
          \t\tpPostMessage.Call(a.hwnd, WM_AI_UPSCALE_DONE, 0, 0)
          \t}
          }'''
          s = s[:old_finish_start] + new_finish + s[old_finish_end:]

          old_done_start = s.index('func (a *viewerApp) onAIUpscaleDone()')
          old_done_end = s.index('\nfunc (a *viewerApp) onAIUpscaleError()', old_done_start)
          new_done = r'''func (a *viewerApp) onAIUpscaleDone() {
          \taiUpscales.mu.Lock()
          \tresult := aiUpscales.resultPath
          \tinput := aiUpscales.inputPath
          \tinputSHA := aiUpscales.inputSHA
          \tscale := aiUpscales.scale
          \tcacheHit := aiUpscales.cacheHit
          \taiUpscales.mu.Unlock()
          \tif result == "" {
          \t\ta.onAIUpscaleErrorText("AI 결과 파일 경로가 비어 있습니다.")
          \t\treturn
          \t}
          \ta.setAICompareCandidate(input, result, scale, inputSHA)
          \ta.openImagePath(result)
          \tcacheNote := ""
          \tif cacheHit {
          \t\tcacheNote = "\n\n같은 원본/배율의 검증된 캐시를 사용해 AI를 다시 실행하지 않았습니다."
          \t}
          \tmessageBox(a.hwnd, fmt.Sprintf("AI %d× 업스케일이 완료되었습니다.\n\n%s\n\n원본 파일은 변경하지 않았습니다.%s\n\nC 키로 원본과 AI 결과를 비교할 수 있습니다.", scale, result, cacheNote), "NightView AI 업스케일", MB_OK|MB_ICONINFO)
          }'''
          s = s[:old_done_start] + new_done + s[old_done_end:]
          p.write_text(s, encoding='utf-8')

          Path('comparison_core.go').write_text(r'''package main

          func clampCompareSplit(v float64) float64 {
          \tif v < 0.02 {
          \t\treturn 0.02
          \t}
          \tif v > 0.98 {
          \t\treturn 0.98
          \t}
          \treturn v
          }

          func compareSplitX(left, right int32, ratio float64) int32 {
          \tif right <= left {
          \t\treturn left
          \t}
          \tratio = clampCompareSplit(ratio)
          \treturn left + int32(float64(right-left)*ratio+0.5)
          }

          func compareDimensionsValid(originalW, originalH, resultW, resultH uint32, scale int) bool {
          \tif originalW == 0 || originalH == 0 || resultW == 0 || resultH == 0 {
          \t\treturn false
          \t}
          \tif scale != 2 && scale != 4 {
          \t\treturn false
          \t}
          \treturn uint64(originalW)*uint64(scale) == uint64(resultW) &&
          \t\tuint64(originalH)*uint64(scale) == uint64(resultH)
          }
          ''', encoding='utf-8')

          Path('comparison_core_test.go').write_text(r'''package main

          import "testing"

          func TestCompareSplitClamp(t *testing.T) {
          \tif got := clampCompareSplit(-1); got != 0.02 {
          \t\tt.Fatalf("low clamp=%v", got)
          \t}
          \tif got := clampCompareSplit(2); got != 0.98 {
          \t\tt.Fatalf("high clamp=%v", got)
          \t}
          \tif got := compareSplitX(10, 110, 0.5); got != 60 {
          \t\tt.Fatalf("split=%d", got)
          \t}
          }

          func TestCompareDimensionRelation(t *testing.T) {
          \tif !compareDimensionsValid(100, 50, 200, 100, 2) {
          \t\tt.Fatal("valid 2x relation rejected")
          \t}
          \tif !compareDimensionsValid(100, 50, 400, 200, 4) {
          \t\tt.Fatal("valid 4x relation rejected")
          \t}
          \tif compareDimensionsValid(100, 50, 201, 100, 2) {
          \t\tt.Fatal("invalid relation accepted")
          \t}
          }
          ''', encoding='utf-8')

          Path('ai_cache.go').write_text(r'''package main

          import (
          \t"crypto/sha256"
          \t"encoding/hex"
          \t"errors"
          \t"fmt"
          \t"image"
          \t_ "image/jpeg"
          \t_ "image/png"
          \t"io"
          \t"os"
          \t"path/filepath"
          \t"sort"
          \t"strings"
          \t"time"
          )

          const (
          \taiCacheMaxBytes   int64 = 2 << 30
          \taiCacheMaxEntries       = 256
          )

          func fileSHA256(path string) (string, int64, error) {
          \tf, err := os.Open(path)
          \tif err != nil {
          \t\treturn "", 0, err
          \t}
          \tdefer f.Close()
          \th := sha256.New()
          \tn, err := io.Copy(h, f)
          \tif err != nil {
          \t\treturn "", 0, err
          \t}
          \treturn hex.EncodeToString(h.Sum(nil)), n, nil
          }

          func aiCacheKey(sourceSHA string, scale int, m aiEngineManifest) (string, error) {
          \tmodel, err := aiModelForScale(m, scale)
          \tif err != nil {
          \t\treturn "", err
          \t}
          \tif len(strings.TrimSpace(sourceSHA)) != 64 {
          \t\treturn "", errors.New("invalid source SHA-256")
          \t}
          \tseed := strings.Join([]string{
          \t\t"nightview-ai-cache-v1", sourceSHA, fmt.Sprint(scale),
          \t\tm.Engine, m.PackageVersion, m.SHA256, model,
          \t}, "|")
          \ts := sha256.Sum256([]byte(seed))
          \treturn hex.EncodeToString(s[:]), nil
          }

          func aiCacheDir(localData string) string {
          \treturn filepath.Join(localData, "ai-cache", "v1")
          }

          func aiCachePath(localData, input, sourceSHA string, scale int, m aiEngineManifest) (string, error) {
          \tkey, err := aiCacheKey(sourceSHA, scale, m)
          \tif err != nil {
          \t\treturn "", err
          \t}
          \treturn filepath.Join(aiCacheDir(localData), key+".png"), nil
          }

          func imageConfig(path string) (image.Config, string, error) {
          \tf, err := os.Open(path)
          \tif err != nil {
          \t\treturn image.Config{}, "", err
          \t}
          \tdefer f.Close()
          \treturn image.DecodeConfig(f)
          }

          func validateAIUpscaleDimensions(input, output string, scale int) error {
          \tinCfg, _, err := imageConfig(input)
          \tif err != nil {
          \t\treturn fmt.Errorf("read input dimensions: %w", err)
          \t}
          \toutCfg, format, err := imageConfig(output)
          \tif err != nil {
          \t\treturn fmt.Errorf("read output dimensions: %w", err)
          \t}
          \tif format != "png" {
          \t\treturn errors.New("AI output is not PNG")
          \t}
          \tif !compareDimensionsValid(uint32(inCfg.Width), uint32(inCfg.Height), uint32(outCfg.Width), uint32(outCfg.Height), scale) {
          \t\treturn fmt.Errorf("unexpected output dimensions: input=%dx%d output=%dx%d scale=%dx", inCfg.Width, inCfg.Height, outCfg.Width, outCfg.Height, scale)
          \t}
          \treturn nil
          }

          func findValidAICache(localData, input, sourceSHA string, scale int, m aiEngineManifest) (string, bool) {
          \tp, err := aiCachePath(localData, input, sourceSHA, scale, m)
          \tif err != nil {
          \t\treturn "", false
          \t}
          \tif err := validateAIUpscaleOutput(p); err != nil {
          \t\tif !errors.Is(err, os.ErrNotExist) {
          \t\t\t_ = os.Remove(p)
          \t\t}
          \t\treturn "", false
          \t}
          \tif err := validateAIUpscaleDimensions(input, p, scale); err != nil {
          \t\t_ = os.Remove(p)
          \t\treturn "", false
          \t}
          \tnow := time.Now()
          \t_ = os.Chtimes(p, now, now)
          \treturn p, true
          }

          func copyFileExclusive(src, dst string) error {
          \tin, err := os.Open(src)
          \tif err != nil {
          \t\treturn err
          \t}
          \tdefer in.Close()
          \tout, err := os.OpenFile(dst, os.O_CREATE|os.O_EXCL|os.O_WRONLY, 0o600)
          \tif err != nil {
          \t\treturn err
          \t}
          \tok := false
          \tdefer func() {
          \t\t_ = out.Close()
          \t\tif !ok {
