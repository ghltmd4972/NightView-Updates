          Copy-Item ..\NightView.exe .\installer\payload\NightView.exe -Force
          Copy-Item ..\NightViewUpdater.exe .\installer\payload\NightViewUpdater.exe -Force
          $env:NIGHTVIEW_AI_FIXTURE = (Resolve-Path ..\NightViewAITestEngine.exe).Path
          go test -count=1 -v -run 'TestCompare|TestAICompare|TestAICache' .
          if ($LASTEXITCODE -ne 0) { throw 'Comparison/cache tests failed.' }
          go test -count=1 ./...
          if ($LASTEXITCODE -ne 0) { throw 'Windows regression suite failed.' }
          go vet -unsafeptr=false ./...
          if ($LASTEXITCODE -ne 0) { throw 'go vet failed.' }

      - name: Repack verified staged source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          tar -czf nightview-source-1.5.tar.gz -C buildsrc .
          $hash = (Get-FileHash nightview-source-1.5.tar.gz -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -eq '94f3eef2e00a514d65df846b1b0937bea8c119c2b53611b3e8f753092ba054c3') {
            throw 'Patched source hash unexpectedly equals NightView 1.4 source.'
          }
          $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes((Resolve-Path 'nightview-source-1.5.tar.gz')))
          Remove-Item source/current/chunk_*.b64 -Force
          $chunkSize = 8000
          $count = [Math]::Ceiling($b64.Length / $chunkSize)
          for ($i = 0; $i -lt $count; $i++) {
            $start = $i * $chunkSize
            $len = [Math]::Min($chunkSize, $b64.Length - $start)
            $part = $b64.Substring($start, $len)
            $name = ('source/current/chunk_{0:D2}.b64' -f $i)
            [IO.File]::WriteAllText((Join-Path $PWD $name), $part, [Text.Encoding]::ASCII)
          }
          "$hash  nightview-source.tar.gz" | Set-Content STAGED_SOURCE_SHA256_1_5.txt -Encoding ascii
          Write-Host "STAGED_1_5_SHA256=$hash"
          Write-Host "STAGED_CHUNKS=$count"

      - name: Commit verified staged source only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A source/current STAGED_SOURCE_SHA256_1_5.txt
          if (git diff --cached --quiet) { throw 'No staged source changes were produced.' }
          git commit -m 'Stage verified NightView 1.5 comparison and cache source'
          git push
