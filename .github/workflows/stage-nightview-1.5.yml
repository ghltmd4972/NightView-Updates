          \t}
          \tif err := os.Rename(tmp, dst); err != nil {
          \t\t_ = os.Remove(tmp)
          \t\tif _, statErr := os.Stat(dst); statErr == nil {
          \t\t\treturn nil
          \t\t}
          \t\treturn err
          \t}
          \treturn nil
          }

          type aiCacheEntry struct {
          \tpath string
          \tsize int64
          \tused time.Time
          }

          func cleanupAICache(localData string) {
          \tentries, err := os.ReadDir(aiCacheDir(localData))
          \tif err != nil {
          \t\treturn
          \t}
          \titems := make([]aiCacheEntry, 0, len(entries))
          \tvar total int64
          \tfor _, e := range entries {
          \t\tif e.IsDir() || strings.ToLower(filepath.Ext(e.Name())) != ".png" {
          \t\t\tcontinue
          \t\t}
          \t\tinfo, err := e.Info()
          \t\tif err != nil {
          \t\t\tcontinue
          \t\t}
          \t\tp := filepath.Join(aiCacheDir(localData), e.Name())
          \t\titems = append(items, aiCacheEntry{p, info.Size(), info.ModTime()})
          \t\ttotal += info.Size()
          \t}
          \tsort.Slice(items, func(i, j int) bool { return items[i].used.Before(items[j].used) })
          \tfor len(items) > aiCacheMaxEntries || total > aiCacheMaxBytes {
          \t\te := items[0]
          \t\titems = items[1:]
          \t\tif os.Remove(e.path) == nil {
          \t\t\ttotal -= e.size
          \t\t}
          \t}
          }
