name: Add NightView 1.6.10 exact Explorer order

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-1-6-10.yml
      - scripts/patch_1_6_10.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightview-1-6-10
  cancel-in-progress: true

jobs:
  patch-build-test-stage:
    runs-on: windows-latest
    env:
      GOFLAGS: -buildvcs=false
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          check-latest: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct and verify 1.6.9 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $chunks = Get-ChildItem 'source/current/chunk_*.b64' | Sort-Object Name
          if ($chunks.Count -lt 1) { throw 'No staged source chunks found.' }
          $text = ($chunks | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes((Join-Path $PWD 'nightview-source.tar.gz'), [Convert]::FromBase64String($text))
          $expected = ((Get-Content SOURCE_SHA256.txt -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash nightview-source.tar.gz -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Current source SHA-256 mismatch: $actual != $expected" }
          New-Item -ItemType Directory -Force buildsrc | Out-Null
          tar -xzf nightview-source.tar.gz -C buildsrc
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -ne '1.6.9') { throw "Expected source version 1.6.9, found $version" }

      - name: Apply exact Explorer order patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts\patch_1_6_10.py buildsrc
          Push-Location buildsrc
          gofmt -w main_windows.go explorer_sort_windows.go explorer_sort_other.go explorer_view_order_windows_test.go
          Pop-Location

          $main = Get-Content buildsrc\main_windows.go -Raw
          $win = Get-Content buildsrc\explorer_sort_windows.go -Raw
          foreach ($needle in @(
            'sortImagePathsLikeOpenExplorer',
            '같은 폴더를 열어 둔 Windows 탐색기 창을 찾지 못했습니다'
          )) {
            if (-not $main.Contains($needle)) { throw "Missing NightView exact Explorer integration: $needle" }
          }
          foreach ($needle in @(
            'Shell.Application',
            'Folder.Items()',
            'queryOpenExplorerViewOrder',
            'reorderFilesByExplorerView',
            'NIGHTVIEW_EXPLORER_FOLDER'
          )) {
            if (-not $win.Contains($needle)) { throw "Missing exact Explorer view-order implementation: $needle" }
          }

      - name: Build and run full Windows regression suite
        shell: pwsh
        working-directory: buildsrc
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '1.6.10'

          go build -trimpath -ldflags="-s -w -buildid= -H=windowsgui -X main.version=$version" -o ..\NightView.exe .
          go build -trimpath -ldflags="-s -w -buildid= -H=windowsgui -X main.version=1.0.0" -o ..\NightViewUpdater.exe .\updater
          go build -trimpath -ldflags="-s -w -buildid= -H=windowsgui" -o ..\NightViewTestSuccess.exe .\updater\testfixture_success
          go build -trimpath -ldflags="-s -w -buildid= -H=windowsgui" -o ..\NightViewTestFailure.exe .\updater\testfixture_failure
          go build -trimpath -ldflags="-s -w -buildid= -H=windowsgui" -o ..\NightViewAITestEngine.exe .\ai\testfixture_engine

          $env:NIGHTVIEW_RELEASE_PE = (Resolve-Path ..\NightView.exe).Path
          $env:NIGHTVIEW_UPDATER_PE = (Resolve-Path ..\NightViewUpdater.exe).Path
          $env:NIGHTVIEW_TARGET_PE = $env:NIGHTVIEW_RELEASE_PE
          $env:NIGHTVIEW_UPDATER_BUILT = $env:NIGHTVIEW_UPDATER_PE
          $env:NIGHTVIEW_SUCCESS_PE = (Resolve-Path ..\NightViewTestSuccess.exe).Path
          $env:NIGHTVIEW_FAILURE_PE = (Resolve-Path ..\NightViewTestFailure.exe).Path
          $env:NIGHTVIEW_AI_FIXTURE = (Resolve-Path ..\NightViewAITestEngine.exe).Path

          go test -count=1 .\...
          go vet -unsafeptr=false .\...

      - name: Repack verified 1.6.10 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location buildsrc
          tar -czf ..\nightview-source-1.6.10.tar.gz *
          Pop-Location

          $hash = (Get-FileHash 'nightview-source-1.6.10.tar.gz' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  nightview-source.tar.gz" | Set-Content 'SOURCE_SHA256.txt' -Encoding ascii
          "$hash  nightview-source.tar.gz" | Set-Content 'STAGED_SOURCE_SHA256_1_6_10.txt' -Encoding ascii
          "1.6.10" | Set-Content 'VERSION' -Encoding ascii

          $notes = @(
            'NightView 1.6.10',
            '- 1.6.9의 탐색기와 동일하게 정렬이 실제 탐색기 순서를 복제하지 못하던 문제 수정',
            '- 같은 폴더를 열고 있는 Windows 탐색기 창의 실제 Folder.Items 표시 순서를 읽어 이미지 파일만 그대로 필터링해 사용',
            '- 탐색기의 이름/수정 날짜/날짜/생성 날짜/크기 등 현재 정렬 기준과 오름차순/내림차순 결과를 그대로 반영',
            '- 탐색기에서 폴더가 먼저 표시되거나 비이미지 파일이 섞여 있어도 NightView 지원 이미지들의 상대 순서는 탐색기와 동일하게 유지',
            '- 같은 폴더의 탐색기 창이 열려 있지 않으면 잘못된 유사 정렬을 적용하지 않고 안내 표시',
            '- 정렬 변경 후 현재 보고 있던 이미지는 그대로 유지',
            '- 기존 탐색기식 파일명 비교 StrCmpLogicalW는 폴백/기존 테스트용으로 유지',
            '- 기존 전체화면 툴바, 이미지 형식/WEBP 판별, 파일 연결, AI 4K 저장/비교, 업데이트/롤백 기능 유지'
          ) -join [Environment]::NewLine
          [IO.File]::WriteAllText((Join-Path $PWD 'RELEASE_NOTES.txt'), $notes + [Environment]::NewLine, (New-Object Text.UTF8Encoding($false)))

          $bytes = [IO.File]::ReadAllBytes((Join-Path $PWD 'nightview-source-1.6.10.tar.gz'))
          $b64 = [Convert]::ToBase64String($bytes)
          Get-ChildItem 'source/current/chunk_*.b64' -ErrorAction SilentlyContinue | Remove-Item -Force
          $chunkSize = 8000
          $index = 0
          for ($offset = 0; $offset -lt $b64.Length; $offset += $chunkSize) {
            $length = [Math]::Min($chunkSize, $b64.Length - $offset)
            $part = $b64.Substring($offset, $length)
            $name = ('source/current/chunk_{0:D4}.b64' -f $index)
            [IO.File]::WriteAllText((Join-Path $PWD $name), $part, (New-Object Text.UTF8Encoding($false)))
            $index++
          }
          Write-Host "Staged 1.6.10 source SHA-256: $hash"
          Write-Host "Wrote $index source chunks."

      - name: Commit verified 1.6.10 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/current SOURCE_SHA256.txt STAGED_SOURCE_SHA256_1_6_10.txt VERSION RELEASE_NOTES.txt
          if (git diff --cached --quiet) { throw 'No verified changes were produced.' }
          git commit -m 'Release NightView 1.6.10 exact Explorer view order'
          git push
