name: Build and publish NightView

on:
  push:
    branches:
      - main
    paths:
      - VERSION
      - RELEASE_NOTES.txt
      - SOURCE_SHA256.txt
      - source/**
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightview-publish
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out update repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          check-latest: false

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          wc -c source/chunk_*.b64
          sha256sum source/chunk_*.b64
          cat source/chunk_*.b64 > source.b64
          base64 -d source.b64 > nightview-source.tar.gz
          sha256sum nightview-source.tar.gz
          sha256sum -c SOURCE_SHA256.txt
          mkdir -p buildsrc
          tar -xzf nightview-source.tar.gz -C buildsrc

      - name: Test source
        shell: bash
        working-directory: buildsrc
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l $(find . -name '*.go' -type f))"
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi
          go test -count=1 ./...
          go test -race -count=1 ./...
          go vet -unsafeptr=false ./...

      - name: Cross-compile Windows tests and executables
        shell: bash
        run: |
          set -euo pipefail
          VERSION_VALUE="$(tr -d '\r\n' < VERSION)"
          cd buildsrc
          export GOOS=windows
          export GOARCH=amd64
          export CGO_ENABLED=0

          go test -c -o ../NightView_tests_windows.exe .
          go test -c -o ../NightViewUpdater_tests_windows.exe ./updater

          go build -trimpath -ldflags="-s -w -buildid= -H=windowsgui" -o ../NightViewUpdater.exe ./updater
          go build -trimpath -ldflags="-s -w -buildid= -H=windowsgui -X main.version=${VERSION_VALUE}" -o ../NightView.exe .

          mkdir -p installer/payload
          cp ../NightView.exe installer/payload/NightView.exe
          cp ../NightViewUpdater.exe installer/payload/NightViewUpdater.exe

          go test -c -o ../NightViewSetup_tests_windows.exe ./installer
          go build -trimpath -ldflags="-s -w -buildid= -H=windowsgui" -o ../NightViewSetup.exe ./installer

      - name: Publish verified binaries and manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION_VALUE="$(tr -d '\r\n' < VERSION)"
          OUT="releases/${VERSION_VALUE}"
          mkdir -p "$OUT"
          cp NightView.exe NightViewUpdater.exe NightViewSetup.exe "$OUT/"

          sha256sum "$OUT/NightView.exe" "$OUT/NightViewUpdater.exe" "$OUT/NightViewSetup.exe" > "$OUT/SHA256SUMS.txt"

          python3 - <<'PY'
          import datetime
          import hashlib
          import json
          import pathlib

          version = pathlib.Path("VERSION").read_text(encoding="utf-8").strip()
          notes = pathlib.Path("RELEASE_NOTES.txt").read_text(encoding="utf-8").strip()
          base = f"https://raw.githubusercontent.com/ghltmd4972/NightView-Updates/main/releases/{version}"

          def artifact(name):
              path = pathlib.Path("releases") / version / name
              data = path.read_bytes()
              return {
                  "url": f"{base}/{name}",
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "size": len(data),
              }

          manifest = {
              "schema": 1,
              "version": version,
              "published_at": datetime.datetime.now(datetime.timezone.utc)
                  .replace(microsecond=0)
                  .isoformat()
                  .replace("+00:00", "Z"),
              "notes": notes,
              "nightview": artifact("NightView.exe"),
              "updater": artifact("NightViewUpdater.exe"),
          }

          pathlib.Path("latest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT" latest.json

          if git diff --cached --quiet; then
            echo "Nothing new to publish."
            exit 0
          fi

          git commit -m "Publish NightView ${VERSION_VALUE}"
          git push
