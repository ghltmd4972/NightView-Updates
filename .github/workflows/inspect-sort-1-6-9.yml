name: Inspect NightView sort implementation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-sort-1-6-9.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $chunks = Get-ChildItem 'source/current/chunk_*.b64' | Sort-Object Name
          $text = ($chunks | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes((Join-Path $PWD 'source.tar.gz'), [Convert]::FromBase64String($text))
          New-Item -ItemType Directory -Force buildsrc | Out-Null
          tar -xzf source.tar.gz -C buildsrc
      - name: Inspect sort source
        shell: pwsh
        working-directory: buildsrc
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -File -Filter *.go | Select-String -Pattern 'sort|natural|filename|random|resolution|extension|modified|created|menu|정렬|파일명|생성|수정|해상도|확장자|랜덤' -CaseSensitive:$false -Context 8,28 | ForEach-Object {
            Write-Host ('--- ' + $_.Path + ':' + $_.LineNumber + ' ---')
            $_.Context.PreContext | ForEach-Object { Write-Host $_ }
            Write-Host $_.Line
            $_.Context.PostContext | ForEach-Object { Write-Host $_ }
          }
