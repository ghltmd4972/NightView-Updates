name: Add NightView 1.6.9 Explorer sorting

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-1-6-9.yml
      - scripts/patch_1_6_9.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightview-1-6-9
  cancel-in-progress: true

jobs:
  patch-build-test-stage:
    runs-on: windows-latest
    env:
      GOFLAGS: -buildvcs=false
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          check-latest: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct and verify 1.6.8 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $chunks = Get-ChildItem 'source/current/chunk_*.b64' | Sort-Object Name
          if ($chunks.Count -lt 1) { throw 'No staged source chunks found.' }
          $text = ($chunks | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes((Join-Path $PWD 'nightview-source.tar.gz'), [Convert]::FromBase64String($text))
          $expected = ((Get-Content SOURCE_SHA256.txt -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash nightview-source.tar.gz -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Current source SHA-256 mismatch: $actual != $expected" }
          New-Item -ItemType Directory -Force buildsrc | Out-Null
          tar -xzf nightview-source.tar.gz -C buildsrc
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -ne '1.6.8') { throw "Expected source version 1.6.8, found $version" }

      - name: Apply Explorer sort patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts\patch_1_6_9.py buildsrc
          Push-Location buildsrc
          gofmt -w core.go core_test.go main_windows.go explorer_sort_windows.go explorer_sort_other.go explorer_sort_windows_test.go
          Pop-Location

          $core = Get-Content buildsrc\core.go -Raw
          $main = Get-Content buildsrc\main_windows.go -Raw
          $win = Get-Content buildsrc\explorer_sort_windows.go -Raw

          foreach ($needle in @(
            'SortExplorer',
            'explorerLogicalLess(a.base, b.base)'
          )) {
            if (-not $core.Contains($needle)) { throw "Missing core Explorer sort behavior: $needle" }
          }
          foreach ($needle in @(
            'cmdSortExplorer',
            '탐색기와 동일하게',
            'a.applySortMode(SortExplorer)'
          )) {
            if (-not $main.Contains($needle)) { throw "Missing Explorer sort menu behavior: $needle" }
          }
          foreach ($needle in @(
            'shlwapi.dll',
            'StrCmpLogicalW'
          )) {
            if (-not $win.Contains($needle)) { throw "Missing Windows Explorer comparator: $needle" }
          }

      - name: Build and run full Windows regression suite
        shell: pwsh
        working-directory: buildsrc
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '1.6.9'

          go build -trimpath -ldflags="-s -w -buildid= -H=windowsgui -X main.version=$version" -o ..\NightView.exe .
          go build -trimpath -ldflags="-s -w -buildid= -H=windowsgui -X main.version=1.0.0" -o ..\NightViewUpdater.exe .\updater
          go build -trimpath -ldflags="-s -w -buildid= -H=windowsgui" -o ..\NightViewTestSuccess.exe .\updater\testfixture_success
          go build -trimpath -ldflags="-s -w -buildid= -H=windowsgui" -o ..\NightViewTestFailure.exe .\updater\testfixture_failure
          go build -trimpath -ldflags="-s -w -buildid= -H=windowsgui" -o ..\NightViewAITestEngine.exe .\ai\testfixture_engine

          $env:NIGHTVIEW_RELEASE_PE = (Resolve-Path ..\NightView.exe).Path
          $env:NIGHTVIEW_UPDATER_PE = (Resolve-Path ..\NightViewUpdater.exe).Path
          $env:NIGHTVIEW_TARGET_PE = $env:NIGHTVIEW_RELEASE_PE
          $env:NIGHTVIEW_UPDATER_BUILT = $env:NIGHTVIEW_UPDATER_PE
          $env:NIGHTVIEW_SUCCESS_PE = (Resolve-Path ..\NightViewTestSuccess.exe).Path
          $env:NIGHTVIEW_FAILURE_PE = (Resolve-Path ..\NightViewTestFailure.exe).Path
          $env:NIGHTVIEW_AI_FIXTURE = (Resolve-Path ..\NightViewAITestEngine.exe).Path

          go test -count=1 .\...
          go vet -unsafeptr=false .\...

      - name: Repack verified 1.6.9 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location buildsrc
          tar -czf ..\nightview-source-1.6.9.tar.gz *
          Pop-Location

          $hash = (Get-FileHash 'nightview-source-1.6.9.tar.gz' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  nightview-source.tar.gz" | Set-Content 'SOURCE_SHA256.txt' -Encoding ascii
          "$hash  nightview-source.tar.gz" | Set-Content 'STAGED_SOURCE_SHA256_1_6_9.txt' -Encoding ascii
          "1.6.9" | Set-Content 'VERSION' -Encoding ascii

          $notes = @(
            'NightView 1.6.9',
            '- 정렬 메뉴에 탐색기와 동일하게 항목 추가',
            '- 탐색기와 동일하게 모드는 Windows shlwapi.dll의 StrCmpLogicalW를 직접 사용해 탐색기식 파일명 자연 정렬 적용',
            '- 숫자가 포함된 파일명도 Windows 탐색기와 같은 논리 순서로 정렬',
            '- 정렬 변경 후 현재 보고 있던 이미지는 그대로 유지',
            '- 기존 파일명 자연 정렬/수정 날짜/생성 날짜/크기/해상도/확장자/랜덤 정렬은 그대로 유지',
            '- Bandizip 압축파일 내부 이미지를 더블클릭했을 때 ArkView가 뜨는 현상은 NightView가 아니라 Bandizip 내부 이미지 뷰어 동작이며 NightView 정렬 수정과는 별개',
            '- 기존 전체화면 툴바, 창 제어, 이미지 형식/WEBP 판별, 파일 연결, AI 4K 저장/비교, 업데이트/롤백 기능 유지'
          ) -join [Environment]::NewLine
          [IO.File]::WriteAllText((Join-Path $PWD 'RELEASE_NOTES.txt'), $notes + [Environment]::NewLine, (New-Object Text.UTF8Encoding($false)))

          $bytes = [IO.File]::ReadAllBytes((Join-Path $PWD 'nightview-source-1.6.9.tar.gz'))
          $b64 = [Convert]::ToBase64String($bytes)
          Get-ChildItem 'source/current/chunk_*.b64' -ErrorAction SilentlyContinue | Remove-Item -Force
          $chunkSize = 8000
          $index = 0
          for ($offset = 0; $offset -lt $b64.Length; $offset += $chunkSize) {
            $length = [Math]::Min($chunkSize, $b64.Length - $offset)
            $part = $b64.Substring($offset, $length)
            $name = ('source/current/chunk_{0:D4}.b64' -f $index)
            [IO.File]::WriteAllText((Join-Path $PWD $name), $part, (New-Object Text.UTF8Encoding($false)))
            $index++
          }
          Write-Host "Staged 1.6.9 source SHA-256: $hash"
          Write-Host "Wrote $index source chunks."

      - name: Commit verified 1.6.9 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/current SOURCE_SHA256.txt STAGED_SOURCE_SHA256_1_6_9.txt VERSION RELEASE_NOTES.txt
          if (git diff --cached --quiet) { throw 'No verified changes were produced.' }
          git commit -m 'Release NightView 1.6.9 Explorer sorting'
          git push
