name: Build AnimePicker Launcher

on:
  push:
    branches:
      - anime-picker-updates
    paths:
      - 'launcher/*.go'
      - 'launcher/go.mod'
      - '.github/workflows/anime-picker-launcher.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Test
        working-directory: launcher
        run: |
          go test ./...
          go vet ./...

      - name: Build launcher
        working-directory: launcher
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path bin -Force | Out-Null
          $env:GOOS='windows'
          $env:GOARCH='amd64'
          go build -trimpath -ldflags="-H=windowsgui -s -w" -o bin/AnimePickerLauncher.exe .

      - name: Commit launcher binary
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add launcher/bin/AnimePickerLauncher.exe
          if (-not (git diff --cached --quiet)) {
            git commit -m "Build AnimePicker launcher"
            git push
          }
